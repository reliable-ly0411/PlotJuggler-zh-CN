name: zh-CN Windows build
'on':
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      release_manifest:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: zh-windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PJ_CTEST_REGEX: '.*'
      CXXFLAGS: /MP
      PJ_PYTHON_EMBED_VERSION: 3.12.7
    steps:
    - name: Sync repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - name: Reconstruct exact formal upstream tag plus pinned downstream patch
      env:
        RELEASE_MANIFEST: ${{ inputs.release_manifest }}
      run: python .github/release_policy/policy.py materialize
    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: 5.15.2
        arch: win64_msvc2019_64
        dir: ${{ github.workspace }}/qt_installation/
        cache: true
        tools: tools_ifw,qt.tools.ifw.47
        add-tools-to-path: 'true'
    - name: Select the bundled Python ABI after Qt setup
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Create isolated Conan home and pathmap profile
      shell: pwsh
      run: |
        $homePath = Join-Path $env:RUNNER_TEMP "pj-conan-pathmap-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        if (Test-Path -LiteralPath $homePath) { throw "Conan home already exists: $homePath" }
        New-Item -ItemType Directory -Path $homePath | Out-Null
        "CONAN_HOME=$homePath" | Out-File -FilePath $env:GITHUB_ENV -Append
        python -m pip install --disable-pip-version-check conan==2.34.0
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $env:CONAN_HOME = $homePath
        conan profile detect
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python scripts/windows_conan_pathmap.py --source "$env:GITHUB_WORKSPACE" --cache "$homePath" --output "$env:RUNNER_TEMP/pj-pathmap.profile"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Conan install from source with path mapping
      shell: pwsh
      run: |
        $buildArgs = @(python scripts/windows_conan_build_check.py arguments)
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $profile = "$env:RUNNER_TEMP/pj-pathmap.profile"
        $overlayProfile = "cmake/conan/openssl-overlay.profile"
        $export = "$env:RUNNER_TEMP/pj-openssl-overlay-export.json"
        conan export cmake/conan/openssl-overlay --name=openssl --version=3.6.5 --user=plotjuggler --channel=stable --format=json --out-file "$export"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $actual = (Get-Content -LiteralPath $export -Raw | ConvertFrom-Json).reference
        $expected = @((Get-Content scripts/windows_conan_host_refs.json -Raw | ConvertFrom-Json) | Where-Object { $_ -match '^openssl/3\.6\.5@plotjuggler/stable#[0-9a-f]{32}$' })
        if ($expected.Count -ne 1 -or $actual -cne $expected[0]) { throw "OpenSSL overlay export revision mismatch" }
        $plan = "$env:RUNNER_TEMP/pj-conan-plan.json"
        $result = "$env:RUNNER_TEMP/pj-conan-install.json"
        conan graph info . @buildArgs --lockfile cmake/conan/windows-msvc194.lock -pr:h "$profile" -pr:h "$overlayProfile" -pr:b=default -s build_type=Release -s compiler.cppstd=17 --format=json --out-file "$plan"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python scripts/windows_conan_build_check.py verify "$plan"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        conan install . -of build @buildArgs --lockfile cmake/conan/windows-msvc194.lock -pr:h "$profile" -pr:h "$overlayProfile" -pr:b=default -s build_type=Release -s compiler.cppstd=17 --deployer=./scripts/conan_license_deployer.py --deployer-folder=build/dependency-notices --format=json --out-file "$result"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python scripts/windows_conan_build_check.py verify "$result"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Build Plotjuggler
      id: native-build
      shell: pwsh
      run: |
        cmake --preset conan-default -S . -B build -DCMAKE_BUILD_TYPE=Release -DPJ_INSTALLATION="windows" -DPJ_PLUGINS_DIRECTORY="bin" -DBUILD_TESTING=ON
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        cmake --build build --config Release
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        $version = (Get-Content build/FORK-VERSION.json -Raw | ConvertFrom-Json).version
        "PJ_SEMVER=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        $sourceSha = git rev-parse HEAD
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        "source-sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
    - name: Test DataFlash and translations
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path acceptance | Out-Null
        $checks = [ordered]@{}
        $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
        python -m pip install --disable-pip-version-check Pillow==11.3.0
        $checks['pillow'] = $LASTEXITCODE
        git fetch --no-tags --depth=1 https://github.com/reliable-ly0411/PlotJuggler-zh-CN.git 3117288ce8d710bde4f7a86ca5ed5240ebb1c301
        $checks['reference'] = $LASTEXITCODE
        $env:PJ_MEME_REFERENCE_DIR = "$env:GITHUB_WORKSPACE/reference-memes"
        $env:PJ_MEME_AUDIT_DIR = "$env:GITHUB_WORKSPACE/acceptance/image-variants"
        python tests/check_translations.py --fresh
        $checks['translations'] = $LASTEXITCODE
        python tests/check_memes.py
        $checks['memes'] = $LASTEXITCODE
        python tests/check_version.py
        $checks['version'] = $LASTEXITCODE
        ctest --test-dir build -C Release -R "$env:PJ_CTEST_REGEX" --output-on-failure --no-tests=error
        $checks['ctest'] = $LASTEXITCODE
        $checks | ConvertTo-Json | Set-Content -Encoding utf8 acceptance/native-step-results.json
        if (@($checks.Values | Where-Object { $_ -ne 0 }).Count) { exit 1 }
    - name: Prepare installer directory
      id: stage-installer
      if: always() && steps.native-build.outcome == 'success'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path installer\io.plotjuggler.application\data
        Copy-Item -Path build\bin\Release\*.* -Destination installer\io.plotjuggler.application\data -Recurse -Force
        cmd /c installer\windeploy_pj.bat
        if ($LASTEXITCODE) { exit $LASTEXITCODE }

        python scripts/stage_fork_notices.py installer/io.plotjuggler.application/data
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Bundle embeddable Python
      id: stage-python
      if: always() && steps.stage-installer.outcome == 'success'
      shell: pwsh
      run: "# Ship a self-contained Python next to plotjuggler.exe so the app\n# works on any Windows host, regardless\
        \ of whether (or which) Python\n# the user has installed. This mirrors what the Linux AppImage does\n# by bundling\
        \ /usr/lib/python3.X. See:\n#   https://docs.python.org/3/using/windows.html#the-embeddable-package\n#\n# The\
        \ embeddable distribution is FLATTENED directly into the data\n# dir (next to plotjuggler.exe), not into a python\\\
        \ subfolder.\n# Reason: when CPython initializes, it locates pythonXY._pth (which\n# tells it where the stdlib\
        \ zip lives) by looking next to the\n# LOADED pythonXY.dll. plotjuggler.exe statically imports\n# pythonXY.dll,\
        \ so the OS loader resolves it from the EXE\n# directory \u2014 meaning pythonXY._pth must also live there.\n\
        $pyVersion = \"${{ env.PJ_PYTHON_EMBED_VERSION }}\"\n$pyXY = ($pyVersion -split '\\.')[0..1] -join '.'      \
        \  # \"3.12\"\n$pyTag = $pyXY -replace '\\.', ''                          # \"312\"\n$url = \"https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip\"\
        \n$zip = Join-Path $env:RUNNER_TEMP \"python-embed.zip\"\n$dataDir = \"installer\\io.plotjuggler.application\\\
        data\"\n\nWrite-Host \"Downloading $url\"\nInvoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing\nExpand-Archive\
        \ -Path $zip -DestinationPath $dataDir -Force\n\n# python.exe is the standalone CLI launcher; we only need the\n\
        # embedded interpreter so drop it (saves ~5 MB).\nRemove-Item (Join-Path $dataDir \"python.exe\") -ErrorAction\
        \ Ignore\nRemove-Item (Join-Path $dataDir \"pythonw.exe\") -ErrorAction Ignore\n\n# python._pth's presence is\
        \ what enables \"isolated mode\": Python\n# ignores PYTHONHOME / PYTHONPATH / registry / user site-packages\n\
        # and only walks the paths listed in this file. Default is fine\n# (it lists pythonXY.zip + \".\") \u2014 ensure\
        \ `import site` stays off.\n$pthFile = Join-Path $dataDir \"python$pyTag._pth\"\nif (Test-Path $pthFile) {\n\
        \  (Get-Content $pthFile) -replace '^\\s*import site', '#import site' |\n    Set-Content $pthFile\n} else {\n\
        \  Write-Error \"python$pyTag._pth not found at $pthFile after extraction\"\n  exit 1\n}\n\n# Sanity check: list\
        \ what we shipped (Python files only)\nWrite-Host \"Bundled Python contents in $dataDir :\"\nGet-ChildItem $dataDir\
        \ |\n  Where-Object { $_.Name -match '^(python|vcruntime|_)|_pth$' } |\n  Format-Table Name, Length\n"
    - name: Bundle MSVC C++ runtime
      id: stage-runtime
      if: always() && steps.stage-installer.outcome == 'success'
      shell: pwsh
      run: |
        # plotjuggler.exe and the plugin DLLs are built with MSVC and link
        # against the Visual C++ runtime (MSVCP140.dll, VCRUNTIME140.dll,
        # ...). windeployqt only bundles Qt DLLs; the embeddable Python ships
        # only vcruntime140.dll (the C runtime), not the C++ side. Without
        # MSVCP140.dll the app fails to start on any machine that doesn't
        # already have the VC++ Redistributable installed.
        #
        # Microsoft's Redist folder ships the runtime DLLs in a
        # freely-redistributable form. Copy the latest x64 set into the
        # data dir so they sit next to plotjuggler.exe.
        $dataDir = "installer\io.plotjuggler.application\data"
        $vsRoot = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -property installationPath
        if (-not $vsRoot) {
          Write-Error "Visual Studio installation not found via vswhere"
          exit 1
        }
        $redistRoot = Join-Path $vsRoot "VC\Redist\MSVC"
        # The layout under VC\Redist\MSVC varies between VS versions / runners
        # (e.g. 14.42.34433\x64\Microsoft.VC143.CRT vs v143\<arch>\...). Walk
        # the tree and pick the most recent x64 CRT folder rather than
        # assuming a fixed structure.
        $crtDir = Get-ChildItem -Path $redistRoot -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'Microsoft.VC*.CRT' -and $_.FullName -match '\\x64\\' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
        if (-not $crtDir) {
          Write-Host "Layout under $redistRoot :"
          Get-ChildItem $redistRoot -Recurse -Directory | Select-Object -First 30 FullName |
            Format-Table -AutoSize
          Write-Error "Could not locate Microsoft.VC*.CRT (x64) redist folder under $redistRoot"
          exit 1
        }
        Write-Host "Copying MSVC runtime from $($crtDir.FullName)"
        Copy-Item (Join-Path $crtDir.FullName "*.dll") -Destination $dataDir -Force
        Get-ChildItem $dataDir -Filter "*.dll" | Where-Object {
          $_.Name -match '^(msvcp|vcruntime|concrt)\d+'
        } | Format-Table Name, Length
    - name: Validate and archive portable application
      id: portable-archive
      if: always() && steps.stage-python.outcome == 'success' && steps.stage-runtime.outcome == 'success'
      shell: pwsh
      run: |
        python scripts/zh_acceptance.py --app installer/io.plotjuggler.application/data/plotjuggler.exe --plugin installer/io.plotjuggler.application/data/DataAPBin.dll --out acceptance
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Compress-Archive -Path installer/io.plotjuggler.application/data/* -DestinationPath PlotJuggler-$env:PJ_SEMVER-Windows-x64.zip
    - name: Validate packaged launcher Qt interaction and persistence
      id: launcher-gui
      if: always() && steps.stage-python.outcome == 'success' && steps.stage-runtime.outcome == 'success'
      shell: pwsh
      run: |
        $env:QT_QPA_PLATFORM = "windows"
        New-Item -ItemType Directory -Force -Path acceptance/launcher-packaged | Out-Null
        python scripts/launcher_acceptance.py --launcher installer/io.plotjuggler.application/data/plotjuggler-launcher.exe --out-base acceptance/launcher-packaged --expected-version "$env:PJ_SEMVER" --expected-platform windows
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Create installer using QT Installation Framework
      id: installer-package
      if: always() && steps.stage-python.outcome == 'success' && steps.stage-runtime.outcome == 'success'
      shell: pwsh
      run: |
        # Sanitize ref_name to replace / with - for valid Windows filename.
        # Also export to GITHUB_ENV so subsequent upload / release steps reuse
        # the same name without independently re-sanitizing.
        $ref_name = $env:PJ_SEMVER
        "SAFE_REF=$ref_name" | Out-File -FilePath $env:GITHUB_ENV -Append
        $installer_name = "PlotJuggler-$ref_name-Windows-x64.exe"

        # Find binarycreator executable
        $binarycreator = Get-ChildItem -Path "${{ github.workspace }}\qt_installation" -Recurse -Name "binarycreator.exe" | Select-Object -First 1
        if (-not $binarycreator) {
            Write-Error "binarycreator.exe not found in Qt installation"
            exit 1
        }
        $binarycreator_path = Join-Path "${{ github.workspace }}\qt_installation" $binarycreator

        # A single outer archive makes IFW extract python312.zip as a file,
        # rather than treating it as a separate component archive.
        $ifwPackages = Join-Path $env:RUNNER_TEMP "pj-ifw-packages-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
        python scripts/windows_ifw_payload.py --component installer/io.plotjuggler.application --output "$ifwPackages"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Write-Host "Creating installer: $installer_name"
        & "$binarycreator_path" --offline-only -c installer\config.xml -p "$ifwPackages" $installer_name

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to create installer"
            exit 1
        }

        Write-Host "Installer created successfully: $installer_name"
    - name: Collect isolated public DLL evidence for independent review
      id: public-binary-review
      if: always() && steps.native-build.outcome == 'success' && steps.stage-runtime.outcome == 'success'
      shell: pwsh
      env:
        REVIEW_SOURCE_SHA: ${{ steps.native-build.outputs.source-sha }}
      run: |
        # This tool only authorizes a privacy-scanned ReviewOnly artifact.
        # It never changes approved identities or approves release payloads.
        python scripts/windows_public_binary_review.py --repo . --build build --payload installer/io.plotjuggler.application/data --out review-only/public-binaries --commit "$env:REVIEW_SOURCE_SHA" --run "$env:GITHUB_RUN_ID" --run-attempt "$env:GITHUB_RUN_ATTEMPT"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Upload isolated DLL review evidence
      if: always() && steps.public-binary-review.outputs.manifest-ready == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ReviewOnly-Windows-public-binaries-${{ steps.native-build.outputs.source-sha }}
        path: |
          review-only/public-binaries/DataLoadParquet.dll
          review-only/public-binaries/ToolboxMosaico.dll
          review-only/public-binaries/ProtobufParser.dll
          review-only/public-binaries/review-manifest.json
        if-no-files-found: error
        retention-days: 14
    - name: Verify real public DLL identities and mutation rejection
      id: public-binary-identities
      if: always() && steps.native-build.outcome == 'success' && steps.stage-runtime.outcome == 'success'
      shell: pwsh
      run: |
        python scripts/verify_public_binary_records.py --payload installer/io.plotjuggler.application/data --out acceptance/public-binary-regressions.json
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Audit packaged payload and sizes
      id: payload-audit
      if: always() && steps.portable-archive.outcome == 'success' && steps.installer-package.outcome == 'success'
      shell: pwsh
      run: |
        $roots = Join-Path $env:RUNNER_TEMP "pj-private-roots-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.json"
        python scripts/collect_private_build_roots.py --source "$env:GITHUB_WORKSPACE" --build "$env:GITHUB_WORKSPACE/build" --cache "$env:CONAN_HOME" --sdk "$env:QT_ROOT_DIR" --cmake-cache "$env:GITHUB_WORKSPACE/build/CMakeCache.txt" --out "$roots"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $exe = "PlotJuggler-$env:PJ_SEMVER-Windows-x64.exe"
        $exeHash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
        $devtools = @(Get-ChildItem -Path "$env:GITHUB_WORKSPACE/qt_installation" -Recurse -File -Filter devtool.exe)
        if ($devtools.Count -ne 1) { throw "Expected exactly one IFW devtool" }
        python scripts/verify_windows_archives.py --stage installer/io.plotjuggler.application/data --portable "PlotJuggler-$env:PJ_SEMVER-Windows-x64.zip" --exe "$exe" --installer-sha "$exeHash" --devtool "$($devtools[0].FullName)" --private-build-roots "$roots" --out acceptance/windows-payload-binding.json
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python scripts/package_size_audit.py --payload installer/io.plotjuggler.application/data --package "PlotJuggler-$env:PJ_SEMVER-Windows-x64.zip" --package "$exe" --private-build-roots "$roots" --out acceptance/package-size.json
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python scripts/verify_windows_binding.py --audit acceptance/package-size.json --binding acceptance/windows-payload-binding.json
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Upload installer
      if: success() && steps.public-binary-identities.outcome == 'success' && steps.payload-audit.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Software-Windows-installer
        path: PlotJuggler-${{ env.SAFE_REF }}-Windows-x64.exe
        if-no-files-found: error
    - name: Upload portable software package
      if: success() && steps.public-binary-identities.outcome == 'success' && steps.payload-audit.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Software-Windows-portable
        path: PlotJuggler-${{ env.PJ_SEMVER }}-Windows-x64.zip
        if-no-files-found: error
    - name: Upload package identity and audit metadata
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Metadata-Windows
        path: acceptance/package-size.json
        if-no-files-found: error
    - name: Upload Windows acceptance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Evidence-Windows
        path: acceptance/
        if-no-files-found: warn
        retention-days: 14
