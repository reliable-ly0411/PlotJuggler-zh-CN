name: zh-CN Linux build
'on':
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      release_manifest:
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: zh-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
        - id: appimage-x64
          runner: ubuntu-22.04
          image: ubuntu:22.04
          arch: x86_64
          target: appimage
        - id: appimage-arm64
          runner: ubuntu-22.04-arm
          image: ubuntu:22.04
          arch: aarch64
          target: appimage
        - id: ubuntu-noble
          runner: ubuntu-24.04
          image: ubuntu:24.04
          arch: x86_64
          target: '24.04'
        - id: debian-bookworm
          runner: ubuntu-24.04
          image: debian:bookworm
          arch: x86_64
          target: bookworm
        - id: debian-trixie
          runner: ubuntu-24.04
          image: debian:trixie
          arch: x86_64
          target: trixie
    steps:
    - name: Install build dependencies
      id: bootstrap
      run: |
        bootstrap_log="$RUNNER_TEMP/pj3-apt-update.log"
        update_exit=0
        apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update > "$bootstrap_log" 2>&1 || update_exit=$?
        cat "$bootstrap_log"
        if test "$update_exit" -ne 0; then
          mkdir -p acceptance
          cp "$bootstrap_log" acceptance/bootstrap-apt-update.log
          {
            date -u
            echo "Expected workflow source: $GITHUB_SHA"
            cat /etc/os-release
            awk '$1 == "nameserver" {print $0}' /etc/resolv.conf
            for apt_host in archive.ubuntu.com security.ubuntu.com ports.ubuntu.com deb.debian.org; do
              echo "Resolver query: $apt_host"
              getent ahosts "$apt_host" || true
            done
          } > acceptance/bootstrap-resolver-observation.log 2>&1
          # Never install against missing/stale indexes, change the resolver,
          # disable signatures/TLS, or silently switch to an unverified mirror.
          exit "$update_exit"
        fi
        DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential cmake git sudo tar gzip zstd ninja-build python3 python3-dev python3-pil qtbase5-dev qttools5-dev-tools qttools5-dev qttranslations5-l10n libqt5svg5-dev libqt5websockets5-dev libqt5opengl5-dev libqt5x11extras5-dev libqt5serialport5-dev libprotoc-dev ccache libmosquitto-dev ca-certificates lsb-release wget libcurl4-openssl-dev libzmq3-dev libprotobuf-dev protobuf-compiler libgrpc++-dev libgtest-dev pkg-config xvfb xauth fonts-noto-cjk dpkg-dev
        test "$(uname -m)" = "${{ matrix.arch }}"
    - name: Sync repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
        fetch-depth: 0
    - name: Trust only this checked-out CI directory
      run: |
        # Container root differs from the checkout mount owner. Scope this to
        # this job and exact workspace, including CMake's Git subprocesses.
        echo 'GIT_CONFIG_COUNT=1' >> "$GITHUB_ENV"
        echo 'GIT_CONFIG_KEY_0=safe.directory' >> "$GITHUB_ENV"
        echo "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
        git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --verify HEAD
    - name: Reconstruct exact formal upstream tag plus pinned downstream patch
      env:
        RELEASE_MANIFEST: ${{ inputs.release_manifest }}
      run: python3 .github/release_policy/policy.py materialize
    - name: Backport the Ubuntu22 QtCore semaphore dependency
      if: matrix.target == 'appimage'
      run: |
        apt-get install -y curl patch perl libicu-dev libglib2.0-dev libpcre2-dev libdouble-conversion-dev zlib1g-dev libzstd-dev
        bash scripts/build_qt5_core_backport.sh "$RUNNER_TEMP/qt5-core-backport"
        echo "PJ_QT5_CORE_BACKPORT=$RUNNER_TEMP/qt5-core-backport/stage" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$RUNNER_TEMP/qt5-core-backport/stage/lib" >> "$GITHUB_ENV"
    - name: Install Apache Arrow for Parquet support
      shell: bash
      run: |
        wget https://packages.apache.org/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
        sudo apt install -y -V ./apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb
        sudo apt update
        sudo apt install -y -V libarrow-dev libarrow-flight-dev libparquet-dev
    - name: Prepare ccache
      shell: bash
      run: |
        mkdir -p ${{ runner.temp }}/ccache/tmp
    - name: Restore compiler cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: pj3-ccache-${{ matrix.id }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: pj3-ccache-${{ matrix.id }}-v1-
    - name: Build Plotjuggler
      id: native-build
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CCACHE_DIR: ${{ runner.temp }}/ccache
      run: |
        cmake . -B build -DCMAKE_BUILD_TYPE=Release -DPJ_INSTALLATION="${{ matrix.target }}" \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DPJ_PLUGINS_DIRECTORY="bin" -DBUILD_TESTING=ON
        grep -R "PJ_HAS_PYTHON" build/CMakeCache.txt build/plotjuggler_app/CMakeFiles  || true
        python3 -c 'import json,subprocess; v=json.load(open("build/FORK-VERSION.json")); s=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(); assert v["source_revision"]==s[:12], v'
        cmake --build build --parallel 2

        python3 -c 'import json,os; v=json.load(open("build/FORK-VERSION.json"))["version"]; open(os.environ["GITHUB_ENV"],"a").write("PJ_SEMVER="+v+"\n")'
    - name: Preserve compiler cache
      if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/ccache
        key: pj3-ccache-${{ matrix.id }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Test DataFlash and translations
      run: |
        mkdir -p acceptance
        checks=()
        collect_check() {
          local check_name="$1" check_exit=0
          shift
          "$@" || check_exit=$?
          checks+=("$check_name:$check_exit")
        }
        collect_check reference git fetch --no-tags --depth=1 https://github.com/reliable-ly0411/PlotJuggler-zh-CN.git 3117288ce8d710bde4f7a86ca5ed5240ebb1c301
        export PJ_MEME_REFERENCE_DIR="$PWD/reference-memes"
        export PJ_MEME_AUDIT_DIR="$PWD/acceptance/image-variants"
        collect_check translations python3 tests/check_translations.py --fresh
        collect_check memes python3 tests/check_memes.py --reference-rev 3117288ce8d710bde4f7a86ca5ed5240ebb1c301 --export-reference reference-memes --pixel-report acceptance/image-pixels.json
        collect_check version python3 tests/check_version.py
        collect_check ctest ctest --test-dir build --output-on-failure --no-tests=error
        collect_check gui xvfb-run -a python3 scripts/zh_acceptance.py --app build/bin/plotjuggler --plugin build/bin/libDataAPBin.so --out acceptance
        python3 -c 'import json,sys; from pathlib import Path; r={k:int(v) for k,v in (x.split(":",1) for x in sys.argv[1:])}; Path("acceptance/native-step-results.json").write_text(json.dumps(r,indent=2)); sys.exit(int(any(r.values())))' "${checks[@]}"
    - name: Build AppImage
      id: appimage-package
      if: always() && steps.native-build.outcome == 'success' && matrix.target == 'appimage'
      working-directory: ${{ github.workspace }}
      env:
        ARCH: ${{ matrix.arch }}
        BUILD_DIR: ${{ github.workspace }}/build
        SKIP_BUILD: '1'
      run: |
        # Reuses the build tree from the previous step and bundles the
        # matching Python stdlib + apprun-hook so the AppImage runs on
        # hosts whose system Python differs from the builder's.
        bash appimage/build_appimage.sh
        # ref_name contains '/' on feature branches; replace with '-' so it's a valid filename
        SAFE_REF="${PJ_SEMVER}"
        mv PlotJuggler-${{ matrix.arch }}.AppImage "PlotJuggler-${SAFE_REF}-${{ matrix.arch }}.AppImage"
        echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"
    - name: Validate packaged AppImage
      if: always() && steps.appimage-package.outcome == 'success' && matrix.target == 'appimage'
      env:
        APPIMAGE_EXTRACT_AND_RUN: '1'
      run: |
        # Do not let workspace libraries make a broken package pass.
        extracted="$(mktemp -d)"
        appimage="$PWD/PlotJuggler-${SAFE_REF}-${{ matrix.arch }}.AppImage"
        (cd "$extracted"; env -u LD_LIBRARY_PATH "$appimage" --appimage-extract >/dev/null)
        core_exit=0
        python3 scripts/check_qt5_core_backport.py "$PJ_QT5_CORE_BACKPORT/lib/libQt5Core.so.5" "$extracted/squashfs-root/usr/lib/libQt5Core.so.5" || core_exit=$?
        gui_exit=0
        env -u LD_LIBRARY_PATH xvfb-run -a python3 scripts/zh_acceptance.py --app "PlotJuggler-${SAFE_REF}-${{ matrix.arch }}.AppImage" --plugin AppDir/usr/bin/libDataAPBin.so --out acceptance/packaged || gui_exit=$?
        audit_exit=0
        python3 scripts/package_size_audit.py --payload AppDir --package "PlotJuggler-${SAFE_REF}-${{ matrix.arch }}.AppImage" --out acceptance/package-size.json || audit_exit=$?
        python3 -c 'import json,sys; from pathlib import Path; r=dict(zip(("qtcore_identity_exit","packaged_gui_exit","package_audit_exit"),map(int,sys.argv[1:]))); Path("acceptance/packaged-step-results.json").write_text(json.dumps(r,indent=2)); sys.exit(int(any(r.values())))' "$core_exit" "$gui_exit" "$audit_exit"
    - name: Validate packaged AppImage launcher Qt interaction
      if: always() && steps.appimage-package.outcome == 'success' && matrix.target == 'appimage'
      env:
        APPIMAGE_EXTRACT_AND_RUN: '1'
        QT_QPA_PLATFORM: xcb
      run: |
        mkdir -p acceptance/launcher-packaged
        env -u LD_LIBRARY_PATH xvfb-run -a python3 scripts/launcher_acceptance.py --launcher "PlotJuggler-${SAFE_REF}-${{ matrix.arch }}.AppImage" --out-base acceptance/launcher-packaged --expected-version "$PJ_SEMVER" --expected-platform xcb
    - name: Build and validate native Debian or Ubuntu package
      id: native-package
      if: always() && steps.native-build.outcome == 'success' && matrix.target != 'appimage'
      run: |
        bash scripts/build_native_deb.sh
        sudo apt-get install -y "$PWD"/output/*.deb
        echo "launcher-ready=true" >> "$GITHUB_OUTPUT"
        xvfb-run -a python3 scripts/zh_acceptance.py --app /usr/bin/plotjuggler --plugin /usr/lib/plotjuggler/libDataAPBin.so --out acceptance/packaged
      env:
        PJ_DEB_DISTRO: ${{ matrix.target }}
    - name: Validate installed native launcher Qt interaction
      if: always() && steps.native-package.outputs.launcher-ready == 'true' && matrix.target != 'appimage'
      env:
        QT_QPA_PLATFORM: xcb
      run: |
        mkdir -p acceptance/launcher-packaged
        xvfb-run -a python3 scripts/launcher_acceptance.py --launcher /usr/bin/plotjuggler-launcher --out-base acceptance/launcher-packaged --expected-version "$PJ_SEMVER" --expected-platform xcb
    - name: Test build without localized images
      if: always() && steps.native-build.outcome == 'success'
      run: |
        cmake -S . -B build -DPJ_ENABLE_LOCALIZED_IMAGES=OFF
        cmake --build build --parallel 2 --target pj_localized_meme_test pj_resource_image_test plotjuggler
        mkdir -p acceptance
        native_exit=0
        ctest --test-dir build --output-on-failure --no-tests=error || native_exit=$?
        gui_exit=0
        xvfb-run -a python3 scripts/zh_acceptance.py --original-images --app build/bin/plotjuggler --plugin build/bin/libDataAPBin.so --out acceptance/images-disabled || gui_exit=$?
        python3 -c 'import json,sys; from pathlib import Path; r=dict(zip(("native_ctest_exit","original_image_gui_exit"),map(int,sys.argv[1:]))); Path("acceptance/images-disabled-step-results.json").write_text(json.dumps(r,indent=2)); sys.exit(int(any(r.values())))' "$native_exit" "$gui_exit"
    - name: Upload AppImage
      if: matrix.target == 'appimage'
      uses: actions/upload-artifact@v4
      with:
        name: Software-linux-${{ matrix.id }}
        path: PlotJuggler-${{ env.SAFE_REF }}-${{ matrix.arch }}.AppImage
        if-no-files-found: error
    - name: Upload native Debian or Ubuntu package
      if: matrix.target != 'appimage'
      uses: actions/upload-artifact@v4
      with:
        name: Software-linux-${{ matrix.id }}
        path: output/*.deb
        if-no-files-found: error
    - name: Upload package identity and audit metadata
      if: always() && steps.native-build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: Metadata-linux-${{ matrix.id }}
        path: acceptance/package-size.json
        if-no-files-found: error
    - name: Upload acceptance evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Evidence-linux-${{ matrix.id }}
        path: acceptance/
        if-no-files-found: warn
        retention-days: 14
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
