    - name: Functional browser suite (Firefox)
      run: |
        xvfb-run -a npm --prefix tests/wasm run test:firefox -- --grep-invert editors.spec.js --shard=${{ matrix.shard }}/2 --reporter=line,json
      env:
        PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/1459-firefox-shard-${{ matrix.shard }}.json
    - name: Editors suite (Firefox)
      if: ${{ !cancelled() && matrix.shard == 1 }}
      run: |
        xvfb-run -a npm --prefix tests/wasm run test:firefox -- --grep editors.spec.js --reporter=line,json
      env:
        PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ runner.temp }}/1459-firefox-editors.json
    - name: Save browser case receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: 1459-wasm-firefox-${{ matrix.shard }}
        path: ${{ runner.temp }}/1459-*.json
        if-no-files-found: ignore
        retention-days: 7
    permissions:
      contents: read
