name: Chinese 4.x development checks

on:
  push:
    branches: [zh-CN-4.x, zh-CN-4.x-dev, 'zh-CN-4.x-*/**']
  pull_request:
    branches: [zh-CN-4.x, zh-CN-4.x-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zh-4x-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Branch, version, and translation guards
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 scripts/check_branch_name.py "$SOURCE_BRANCH"
          python3 tests/test_branch_policy.py -v
          python3 tests/test_check_translations_4x.py -v
          python3 tests/check_translations_4x.py --catalog-only
          python3 tests/check_localization_provenance.py
          git diff --check

  native:
    # A topic PR already builds its head. Avoid a second cold dependency build
    # for the same topic push; integrated branches and manual runs still build.
    if: github.event_name != 'push' || github.ref_name == 'zh-CN-4.x' || github.ref_name == 'zh-CN-4.x-dev'
    needs: source-checks
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_arch: gcc_64
            generator: Ninja
          - os: windows-2022
            qt_arch: msvc2022_64
            generator: Ninja Multi-Config
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read pinned versions
        id: versions
        run: |
          source ./versions.env
          echo "PJ_QT_VERSION=$PJ_QT_VERSION" >> "$GITHUB_ENV"
          echo "qt_version=$PJ_QT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build tools
        run: python -m pip install 'conan>=2,<3' 'cmake>=3.28,<4' 'ninja!=1.13.0' 'aqtinstall>=3.3'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libva-dev libdrm-dev \
            xvfb zstd pkg-config ccache fonts-noto-cjk
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/cache@v5
        with:
          path: .qt
          key: zh4-qt-${{ matrix.os }}-${{ steps.versions.outputs.qt_version }}
      - name: Install pinned Linux Qt
        if: runner.os == 'Linux'
        run: ./scripts/install_qt6.sh
      - name: Install pinned Windows Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/install_qt6.ps1
      - name: Focused language build and tests
        run: |
          qt_dir="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}"
          export PATH="$qt_dir/bin:$PATH"
          python tests/check_translations_4x.py --lupdate "$qt_dir/bin/lupdate"
          cmake -S pj_app/tests/i18n -B build-i18n -G "${{ matrix.generator }}" \
            -DCMAKE_PREFIX_PATH="$qt_dir" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-i18n --config RelWithDebInfo --parallel 2
          ctest --test-dir build-i18n --build-config RelWithDebInfo --output-on-failure --timeout 60
      - uses: actions/cache/restore@v5
        id: conan-cache
        with:
          path: ~/.conan2
          key: zh4-conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}
          restore-keys: |
            zh4-conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}-partial-
            zh4-conan-${{ matrix.os }}-
      - name: Prepare Conan sources
        run: |
          conan profile detect --force
          ./scripts/configure_conan_remote.sh
          cache_dir="$(python -c 'import os; print(os.path.abspath(".conan-source-cache").replace(chr(92), "/"))')"
          mkdir -p "$cache_dir/s"
          find .github/conan/source-backup -maxdepth 1 -type f ! -name README.md -exec cp {} "$cache_dir/s/" \;
          conan_home="$(conan config home)"
          mkdir -p "$conan_home"
          python - "$conan_home/global.conf" "$cache_dir" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text().splitlines() if p.exists() else []
          lines = [s for s in lines if not s.startswith(('core.sources:download_cache=', 'core.sources:download_urls='))]
          lines += [f'core.sources:download_cache={sys.argv[2]}',
                    'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]']
          p.write_text('\n'.join(lines) + '\n')
          PY
      - name: Resolve exact Linux SDK and dependencies
        if: runner.os == 'Linux'
        id: conan-linux
        run: |
          conan install . --output-folder=build --build=missing \
            -r=plotjuggler-conan -r=conancenter --lockfile=conan.lock --lockfile-partial \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 -c tools.build:jobs=2
      - name: Resolve exact Windows SDK and dependencies
        if: runner.os == 'Windows'
        id: conan-windows
        # Invoke Conan outside Git Bash. Its FFmpeg recipe launches its own
        # MSYS shell; nested shells can corrupt pkg-config's native path list.
        # https://github.com/conan-io/conan-center-index/issues/30348
        shell: pwsh
        run: |
          conan install . --output-folder=build --build=missing `
            -r=plotjuggler-conan -r=conancenter --lockfile=conan.lock --lockfile-partial `
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 -c tools.build:jobs=2 `
            -o 'cpython/*:shared=True' -s 'cpython/*:build_type=Release' `
            -s compiler.version=194 -c 'tools.cmake.cmaketoolchain:generator=Ninja Multi-Config'
          exit $LASTEXITCODE
      - name: Preserve FFmpeg dav1d probe diagnostics
        if: failure() && (steps.conan-linux.outcome == 'failure' || steps.conan-windows.outcome == 'failure')
        run: |
          python - <<'PYLOG'
          from pathlib import Path
          import subprocess
          home = Path(subprocess.check_output(['conan', 'config', 'home'], text=True).strip())
          output = Path('build/diagnostics')
          output.mkdir(parents=True, exist_ok=True)
          for index, path in enumerate(home.glob('p/b/ffmpe*/b/build-*/ffbuild/config.log')):
              # configure starts this log with `set`, including the complete
              # process environment. Never publish that preamble as an artifact.
              lines = path.read_text(errors='replace').splitlines()
              probes = [i for i, line in enumerate(lines)
                        if line.startswith(('require_pkg_config libdav1d ',
                                            'check_pkg_config libdav1d '))]
              if not probes:
                  print('No dav1d probe found; the environment-bearing log is omitted.')
                  continue
              diagnostic = '\n'.join(lines[probes[-1]:][:400]) + '\n'
              (output / f'ffmpeg-{index}-dav1d-probe.log').write_text(diagnostic)
              print(f'--- {path.name}: {path.parent.parent.name} ---')
              print(diagnostic)
          PYLOG
      - name: Trim incomplete Conan cache
        if: failure() && (steps.conan-linux.outcome == 'failure' || steps.conan-windows.outcome == 'failure')
        run: conan cache clean "*" --build --source --temp
      - name: Retain completed dependency packages for retry
        if: failure() && (steps.conan-linux.outcome == 'failure' || steps.conan-windows.outcome == 'failure')
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          # Never mark an incomplete graph as the exact, successful closure.
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      # Save resolved packages before application compilation/tests. A failing
      # regression must not discard a successful, expensive dependency build.
      - name: Trim Conan build cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache clean "*" --build --source --temp
      - uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Configure and build application plus regressions
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPJ_BUILD_TESTS=ON -DPJ_BUILD_DEMOS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build --config RelWithDebInfo --parallel 2
      - name: Run native tests
        run: |
          export PATH="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}/bin:$PATH"
          export PJ_GUI_ACCEPTANCE_DIR="$(python -c 'import os; print(os.path.abspath("build/gui-acceptance").replace(chr(92), "/"))')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            for list in build/pj_ffmpeg_bin_dirs.txt build/pj_python_bin_dirs.txt; do
              if [[ -f "$list" ]]; then
                while IFS= read -r dir; do
                  [[ -z "$dir" ]] || export PATH="$(cygpath -u "$dir"):$PATH"
                done < "$list"
              fi
            done
            QT_QPA_PLATFORM=offscreen ctest --test-dir build --build-config RelWithDebInfo --output-on-failure --timeout 120
          else
            PJ_REQUIRE_GPU_TESTS=1 xvfb-run -a ctest --test-dir build --output-on-failure --timeout 120
          fi
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh4-test-reports-${{ matrix.os }}
          path: |
            build-i18n/Testing/Temporary/
            build/Testing/Temporary/
            build/diagnostics/
            build/gui-acceptance/
          if-no-files-found: ignore
          retention-days: 14
