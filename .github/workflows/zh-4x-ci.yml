name: Chinese 4.x development checks

on:
  push:
    branches: [zh-CN-4.x, zh-CN-4.x-dev, 'zh-CN-4.x-*/**']
  pull_request:
    branches: [zh-CN-4.x, zh-CN-4.x-dev]
  workflow_dispatch:
    inputs:
      windows_native_build:
        description: 'Build and independently verify the Windows test kit'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: zh-4x-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-native-media:
    # Synthetic inputs only; this isolated job does not change release assets.
    if: github.event_name == 'workflow_dispatch' && inputs.windows_native_build == true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      manifest_sha256: ${{ steps.generate.outputs.manifest_sha256 }}
      source_sha: ${{ steps.generate.outputs.source_sha }}
      source_tree: ${{ steps.generate.outputs.source_tree }}
    steps:
      - name: Initialize retained media evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/pj-media-evidence"
          printf '%s\n' 'Media generation was started; success is recorded only after semantic readback.' > "$RUNNER_TEMP/pj-media-evidence/status.txt"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Acquire and record signed Ubuntu FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pj-media-evidence"
          trap 'printf "provisioning failed at line %s, exit %s\n" "$LINENO" "$?" > "$evidence/failure.txt"' ERR
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          git submodule status --recursive > "$evidence/source-submodules.txt"
          ! grep -E '^[-+U]' "$evidence/source-submodules.txt"
          mkdir "$evidence/apt-signatures" "$evidence/downloads"
          source_list="$RUNNER_TEMP/pj-ubuntu-official.list"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://security.ubuntu.com/ubuntu noble-security main universe' > "$source_list"
          cp "$source_list" "$evidence/ubuntu-official.list"
          cp /usr/share/keyrings/ubuntu-archive-keyring.gpg "$evidence/apt-signatures/ubuntu-archive-keyring.gpg"
          sha256sum "$evidence/apt-signatures/ubuntu-archive-keyring.gpg" > "$evidence/apt-signatures/keyring.sha256"
          opts=(-o "Dir::Etc::sourcelist=$source_list" -o 'Dir::Etc::sourceparts=-' -o 'APT::Get::List-Cleanup=0')
          sudo apt-get "${opts[@]}" update > "$evidence/apt-update.stdout" 2> "$evidence/apt-update.stderr"
          for suite in noble noble-updates noble-security; do
            host=archive.ubuntu.com
            if [[ "$suite" == noble-security ]]; then host=security.ubuntu.com; fi
            release="/var/lib/apt/lists/${host}_ubuntu_dists_${suite}_InRelease"
            test -f "$release" && test ! -L "$release"
            cp "$release" "$evidence/apt-signatures/${suite}.InRelease"
            gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$release" > "$evidence/apt-signatures/${suite}.gpgv.stdout" 2> "$evidence/apt-signatures/${suite}.gpgv.stderr"
          done
          find /var/lib/apt/lists -maxdepth 1 -type f \( -name 'archive.ubuntu.com_ubuntu_dists_noble*_binary-amd64_Packages*' -o -name 'security.ubuntu.com_ubuntu_dists_noble-security*_binary-amd64_Packages*' \) -exec cp -t "$evidence/apt-signatures" -- {} +
          test "$(find "$evidence/apt-signatures" -name '*Packages*' -type f | wc -l)" -gt 0
          apt-cache "${opts[@]}" policy ffmpeg > "$evidence/apt-policy.txt"
          version=$(sed -n 's/^[[:space:]]*Candidate:[[:space:]]*//p' "$evidence/apt-policy.txt")
          [[ "$version" =~ ^[0-9][A-Za-z0-9.+:~_-]*$ ]]
          apt-cache "${opts[@]}" show "ffmpeg=$version" > "$evidence/apt-show.txt"
          sudo apt-get "${opts[@]}" install -y --no-install-recommends "ffmpeg=$version" > "$evidence/apt-install.stdout" 2> "$evidence/apt-install.stderr"
          apt-get "${opts[@]}" --print-uris download "ffmpeg=$version" > "$evidence/apt-download-uri.txt" 2> "$evidence/apt-download-uri.stderr"
          (cd "$evidence/downloads" && apt-get "${opts[@]}" download "ffmpeg=$version") > "$evidence/apt-download.stdout" 2> "$evidence/apt-download.stderr"
          dpkg-query -W -f='${binary:Package}\t${Version}\n' > "$evidence/installed-packages.tsv"
          LC_ALL=C ldd /usr/bin/ffmpeg /usr/bin/ffprobe > "$evidence/dynamic-libraries.txt" 2>&1
          ! grep -F 'not found' "$evidence/dynamic-libraries.txt"
          python3 scripts/native-fixtures/record_dynamic_libraries.py "$evidence"
          test -s "$evidence/dynamic-library-identities.json"
          python3 - "$evidence" "$version" <<'PY'
          import hashlib, json, pathlib, re, shlex, sys, urllib.parse
          evidence, version = pathlib.Path(sys.argv[1]), sys.argv[2]
          rows = [shlex.split(line) for line in (evidence / 'apt-download-uri.txt').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(rows) == 1 and len(rows[0]) == 4, 'expected one actual APT package URI'
          url, filename, size, checksum = rows[0]
          parsed = urllib.parse.urlsplit(url)
          assert parsed.scheme in ('http', 'https') and parsed.hostname in ('archive.ubuntu.com', 'security.ubuntu.com')
          assert not parsed.username and not parsed.password and not parsed.query and not parsed.fragment
          assert re.fullmatch(r'(?:SHA256:[0-9a-fA-F]{64}|SHA512:[0-9a-fA-F]{128})', checksum)
          packages = list((evidence / 'downloads').glob('*.deb'))
          assert len(packages) == 1 and packages[0].name == filename and packages[0].stat().st_size == int(size)
          value = hashlib.file_digest(packages[0].open('rb'), 'sha256').hexdigest()
          algorithm, printed_hash = checksum.split(':', 1)
          actual_hash = value if algorithm == 'SHA256' else hashlib.file_digest(packages[0].open('rb'), 'sha512').hexdigest()
          assert actual_hash == printed_hash.lower(), 'downloaded .deb differs from APT URI checksum'
          stanzas = (evidence / 'apt-show.txt').read_text(encoding='utf-8').strip().split('\n\n')
          matches = []
          for stanza in stanzas:
              fields = dict(line.split(': ', 1) for line in stanza.splitlines() if ': ' in line and not line.startswith(' '))
              if fields.get('Package') == 'ffmpeg' and fields.get('Version') == version:
                  matches.append(fields)
          assert len(matches) == 1 and matches[0].get('SHA256', '').lower() == value
          assert matches[0].get(algorithm, '').lower() == actual_hash and matches[0].get('Size') == size
          assert parsed.path.endswith('/' + matches[0]['Filename'])
          provenance = {'package': 'ffmpeg', 'version': version, 'url': url, 'sha256': value,
                        'apt_signature_evidence': 'pj-media-evidence/apt-signatures'}
          (evidence / 'tool-provenance.json').write_text(json.dumps(provenance, indent=2) + '\n', encoding='utf-8')
          (evidence / 'ffmpeg-deb-path.txt').write_text(str(packages[0]) + '\n', encoding='utf-8')
          PY
      - name: Acquire locked MCAP source and license
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pj-media-evidence"
          trap 'printf "MCAP acquisition failed at line %s, exit %s\n" "$LINENO" "$?" > "$evidence/failure.txt"' ERR
          url=$(python3 -c 'import json; print(json.load(open("scripts/native-fixtures/mcap-source-lock.json", encoding="utf-8"))["archive_url"])')
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 180 --output "$evidence/mcap-source.tar.gz" "$url" > "$evidence/mcap-download.stdout" 2> "$evidence/mcap-download.stderr"
          python3 - "$evidence/mcap-source.tar.gz" "$RUNNER_TEMP/pj-mcap-source" <<'PY'
          import hashlib, json, pathlib, re, sys, tarfile
          archive, output = map(pathlib.Path, sys.argv[1:])
          lock = json.loads(pathlib.Path('scripts/native-fixtures/mcap-source-lock.json').read_text(encoding='utf-8'))
          assert hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() == lock['archive_sha256']
          assert not output.exists(); output.mkdir()
          with tarfile.open(archive, 'r:gz') as source:
              members = source.getmembers()
              anchors = [x.name for x in members if x.isfile() and x.name.endswith('/cpp/mcap/include/mcap/mcap.hpp')]
              assert len(anchors) == 1
              prefix = anchors[0].removesuffix('/cpp/mcap/include/mcap/mcap.hpp')
              assert all(re.fullmatch(r'mcap/[A-Za-z0-9_.+-]+', name) for name in lock['headers'])
              requested = {'cpp/mcap/include/' + name: sha for name, sha in lock['headers'].items()}
              requested['LICENSE'] = lock['license_sha256']
              for name, expected in requested.items():
                  matches = [x for x in members if x.name == prefix + '/' + name]
                  assert len(matches) == 1 and matches[0].isfile() and matches[0].size <= 16 * 1024 * 1024
                  src = source.extractfile(matches[0]); data = src.read(); assert len(data) == matches[0].size
                  assert hashlib.sha256(data).hexdigest() == expected
                  target = output / name; target.parent.mkdir(parents=True, exist_ok=True)
                  with target.open('xb') as stream: stream.write(data)
          PY
          sha256sum "$evidence/mcap-source.tar.gz" > "$evidence/mcap-source.sha256"
      - name: Generate and semantically read back media
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pj-media-evidence"
          trap 'printf "media generation failed at line %s, exit %s\n" "$LINENO" "$?" > "$evidence/failure.txt"' ERR
          python3 scripts/native-fixtures/test_generate_media_fixtures.py > "$evidence/generator-tests.stdout" 2> "$evidence/generator-tests.stderr"
          package=$(cat "$evidence/ffmpeg-deb-path.txt")
          python3 scripts/native-fixtures/generate_media_fixtures.py --output "$RUNNER_TEMP/pj-generated-media" \
            --mcap-include "$RUNNER_TEMP/pj-mcap-source/cpp/mcap/include" --mcap-license "$RUNNER_TEMP/pj-mcap-source/LICENSE" \
            --ffmpeg /usr/bin/ffmpeg --ffprobe /usr/bin/ffprobe --cxx /usr/bin/g++ \
            --tool-package "$package" --tool-provenance "$evidence/tool-provenance.json" \
            > "$evidence/generator.stdout" 2> "$evidence/generator.stderr"
          sha=$(sha256sum "$RUNNER_TEMP/pj-generated-media/manifest.json" | cut -d' ' -f1)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]]
          python3 scripts/native-fixtures/verify_fixture_manifest.py --directory "$RUNNER_TEMP/pj-generated-media" \
            --expected-manifest-sha256 "$sha" > "$evidence/verify.stdout" 2> "$evidence/verify.stderr"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all --ignore-submodules=none)"
          tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          printf 'manifest_sha256=%s\nsource_sha=%s\nsource_tree=%s\n' "$sha" "$GITHUB_SHA" "$tree" >> "$GITHUB_OUTPUT"
          printf '%s\n' 'Generation and semantic readback completed.' > "$evidence/status.txt"
      - name: Upload generated media only after verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-native-generated-media-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pj-generated-media
          if-no-files-found: error
          retention-days: 7
      - name: Preserve media generation evidence, including failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-native-media-evidence-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pj-media-evidence
            ${{ runner.temp }}/pj-generated-media/evidence
          if-no-files-found: error
          retention-days: 7
  windows-native-test-build:
    # Opt-in and isolated from the existing native, packaging and release jobs.
    needs: [windows-native-media]
    env:
      PJ_MEDIA_MANIFEST_SHA256: ${{ needs.windows-native-media.outputs.manifest_sha256 }}
      PJ_MEDIA_SOURCE_SHA: ${{ needs.windows-native-media.outputs.source_sha }}
      PJ_MEDIA_SOURCE_TREE: ${{ needs.windows-native-media.outputs.source_tree }}
    if: github.event_name == 'workflow_dispatch' && inputs.windows_native_build == true
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}
      archive_bytes: ${{ steps.build.outputs.archive_bytes }}
      expanded_bytes: ${{ steps.build.outputs.expanded_bytes }}
      source_sha: ${{ steps.build.outputs.source_sha }}
      source_tree: ${{ steps.build.outputs.source_tree }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\pj-checkout.gitconfig
          GIT_ATTR_NOSYSTEM: '1'
        with:
          submodules: recursive
          persist-credentials: false
      - name: Remove isolated checkout Git config
        if: always()
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pj-checkout.gitconfig'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Download exact generated CI media
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-native-generated-media-${{ github.run_attempt }}
          path: ${{ runner.temp }}\pj-native-media
          digest-mismatch: error
      - name: Run actual bootstrap ZIP, NTFS and fixed-root negative controls
        id: bootstrap_tests
        run: ./scripts/windows/prepare_native_ci.ps1 -Phase BootstrapSelfTest
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Compile and stage only after closure evidence
        id: build
        env:
          BOOTSTRAP_SELFTEST_DIR: ${{ steps.bootstrap_tests.outputs.evidence_dir }}
        run: ./scripts/windows/prepare_native_ci.ps1
      - name: Bootstrap and run reviewed groups before upload
        id: native_verify
        env:
          KIT_ARCHIVE: ${{ steps.build.outputs.archive_path }}
          KIT_ARCHIVE_SHA: ${{ steps.build.outputs.archive_sha256 }}
          KIT_MANIFEST_SHA: ${{ steps.build.outputs.manifest_sha256 }}
          KIT_EXPANDED_BYTES: ${{ steps.build.outputs.expanded_bytes }}
          KIT_SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
          KIT_SOURCE_TREE: ${{ steps.build.outputs.source_tree }}
        run: |
          ./scripts/windows/prepare_native_ci.ps1 -Phase Verify -RetainBuild -Archive $env:KIT_ARCHIVE `
            -ArchiveSha256 $env:KIT_ARCHIVE_SHA -ManifestSha256 $env:KIT_MANIFEST_SHA `
            -SourceSha $env:KIT_SOURCE_SHA -SourceTree $env:KIT_SOURCE_TREE -ExpandedBytes $env:KIT_EXPANDED_BYTES
      - name: Preserve content-free failed configure diagnostics
        id: failed_config_diagnostics
        if: always() && steps.build.outcome == 'failure'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          $sha = $env:EXPECTED_SOURCE_SHA
          if ($sha -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source identity.' }
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $sha) { throw 'Checkout identity mismatch.' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tree -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source tree.' }
          $root = 'C:\Users\Administrator\PlotJuggler-4.1.0-zh-test-558a\n\' + $sha.Substring(0, 12)
          python -I -B ./scripts/windows/collect_failed_config_diagnostics.py --root $root `
            --output (Join-Path $env:RUNNER_TEMP 'pj-failed-config-diagnostics') --source-sha $sha --source-tree $tree
          if ($LASTEXITCODE -ne 0) { throw 'Safe failure diagnostics unavailable.' }
      - name: Upload content-free failure diagnostics
        if: always() && steps.failed_config_diagnostics.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-failed-config-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}\pj-failed-config-diagnostics
          if-no-files-found: error
          retention-days: 7
      - name: Preserve producer CI run evidence
        id: native_evidence
        if: always() && steps.build.outcome == 'success'
        env:
          KIT_ARCHIVE_SHA: ${{ steps.build.outputs.archive_sha256 }}
          KIT_MANIFEST_SHA: ${{ steps.build.outputs.manifest_sha256 }}
          KIT_SOURCE_SHA: ${{ steps.build.outputs.source_sha }}
          KIT_SOURCE_TREE: ${{ steps.build.outputs.source_tree }}
          VERIFY_OUTCOME: ${{ steps.native_verify.outcome }}
        run: |
          $root = 'C:\Users\Administrator\PlotJuggler-4.1.0-zh-test-558a\n\' + $env:KIT_SOURCE_SHA.Substring(0, 12)
          $evidence = Join-Path $env:RUNNER_TEMP 'pj-native-ci-evidence-producer'
          python -I -B ./scripts/windows/collect_native_ci_evidence.py --root $root --output $evidence `
            --source-sha $env:KIT_SOURCE_SHA --source-tree $env:KIT_SOURCE_TREE `
            --archive-sha256 $env:KIT_ARCHIVE_SHA --manifest-sha256 $env:KIT_MANIFEST_SHA `
            --scope producer --outcome $env:VERIFY_OUTCOME
          if ($LASTEXITCODE -ne 0) { throw 'Could not safely preserve producer CI evidence.' }
      - name: Upload producer CI evidence, including incomplete runs
        if: always() && steps.native_evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-native-producer-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}\pj-native-ci-evidence-producer
          if-no-files-found: error
          retention-days: 7
      # This is a test-only raw ZIP, not a release asset. Until the dependent
      # clean job passes, the artifact remains a CI candidate, not a verified kit.
      - name: Upload the single raw candidate ZIP
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ steps.build.outputs.archive_path }}
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Compare official upload digest to the original bytes
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.archive_sha256 }}
          UPLOAD_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          $actual = $env:UPLOAD_DIGEST -creplace '^sha256:', ''
          if ($actual -cnotmatch '^[0-9a-f]{64}$' -or $actual -cne $env:EXPECTED_DIGEST) {
            throw 'The official raw upload digest does not match the independently computed inner ZIP digest.'
          }

  windows-native-test-clean:
    # A new hosted runner, checkout and system bootstrap authenticate the raw
    # artifact before starting its Python or any other downloaded executable.
    needs: [windows-native-test-build, windows-native-media]
    env:
      PJ_MEDIA_MANIFEST_SHA256: ${{ needs.windows-native-media.outputs.manifest_sha256 }}
      PJ_MEDIA_SOURCE_SHA: ${{ needs.windows-native-media.outputs.source_sha }}
      PJ_MEDIA_SOURCE_TREE: ${{ needs.windows-native-media.outputs.source_tree }}
    if: github.event_name == 'workflow_dispatch' && inputs.windows_native_build == true
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        env:
          GIT_CONFIG_NOSYSTEM: '1'
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}\pj-checkout.gitconfig
          GIT_ATTR_NOSYSTEM: '1'
        with:
          ref: ${{ needs.windows-native-test-build.outputs.source_sha }}
          submodules: recursive
          persist-credentials: false
      - name: Remove isolated checkout Git config
        if: always()
        run: |
          $path = Join-Path $env:RUNNER_TEMP 'pj-checkout.gitconfig'
          if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Force }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
      - name: Reserve space for raw transport, extraction and test growth
        env:
          ARCHIVE_BYTES: ${{ needs.windows-native-test-build.outputs.archive_bytes }}
          EXPANDED_BYTES: ${{ needs.windows-native-test-build.outputs.expanded_bytes }}
        run: |
          if ($env:ARCHIVE_BYTES -notmatch '^[0-9]+$' -or $env:EXPANDED_BYTES -notmatch '^[0-9]+$') {
            throw 'Missing or invalid measured ZIP and expanded sizes.'
          }
          $compressed = [Int64]$env:ARCHIVE_BYTES
          $expanded = [Int64]$env:EXPANDED_BYTES
          if ($compressed -le 0 -or $compressed -gt 16GB -or $expanded -le 0 -or $expanded -gt 32GB) {
            throw 'Measured artifact sizes exceed bootstrap limits.'
          }
          $download = Join-Path $env:RUNNER_TEMP 'pj-native-raw-artifact'
          $downloadDrive = [IO.Path]::GetPathRoot($download)
          $rootDrive = [IO.Path]::GetPathRoot('C:\')
          $rootNeed = $expanded + 1GB + 2GB
          $transportNeed = 2 * $compressed + 2GB
          $rootFree = ([IO.DriveInfo]::new($rootDrive)).AvailableFreeSpace
          $transportFree = ([IO.DriveInfo]::new($downloadDrive)).AvailableFreeSpace
          if ([string]::Equals($rootDrive, $downloadDrive, [StringComparison]::OrdinalIgnoreCase)) {
            $rootNeed += 2 * $compressed
          }
          Write-Host "Measured compressed=$compressed expanded=$expanded; C required=$rootNeed free=$rootFree; transport $downloadDrive required=$transportNeed free=$transportFree"
          if ($rootFree -lt $rootNeed -or $transportFree -lt $transportNeed) {
            throw 'Insufficient disk space for transport, extraction, test growth and reserves.'
          }
          if (Test-Path -LiteralPath $download) { throw 'Refusing to reuse an artifact download directory.' }
          New-Item -ItemType Directory -Path $download | Out-Null
      - name: Download the raw artifact with official digest verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-native-kit.zip
          path: ${{ runner.temp }}\pj-native-raw-artifact
          skip-decompress: true
          digest-mismatch: error
      - name: Bootstrap and rerun the reviewed CI groups
        id: native_verify
        env:
          KIT_ARCHIVE_SHA: ${{ needs.windows-native-test-build.outputs.archive_sha256 }}
          KIT_MANIFEST_SHA: ${{ needs.windows-native-test-build.outputs.manifest_sha256 }}
          KIT_EXPANDED_BYTES: ${{ needs.windows-native-test-build.outputs.expanded_bytes }}
          KIT_SOURCE_SHA: ${{ needs.windows-native-test-build.outputs.source_sha }}
          KIT_SOURCE_TREE: ${{ needs.windows-native-test-build.outputs.source_tree }}
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'pj-native-raw-artifact'
          $items = @(Get-ChildItem -LiteralPath $download -Force)
          if ($items.Count -ne 1 -or $items[0].Name -cne 'windows-native-kit.zip' -or $items[0].PSIsContainer -or
              ($items[0].Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'Official download did not produce exactly the expected raw ZIP file.'
          }
          ./scripts/windows/prepare_native_ci.ps1 -Phase Verify -Archive $items[0].FullName `
            -ArchiveSha256 $env:KIT_ARCHIVE_SHA -ManifestSha256 $env:KIT_MANIFEST_SHA `
            -SourceSha $env:KIT_SOURCE_SHA -SourceTree $env:KIT_SOURCE_TREE -ExpandedBytes $env:KIT_EXPANDED_BYTES
      - name: Preserve independent CI run evidence
        id: native_evidence
        if: always()
        env:
          KIT_ARCHIVE_SHA: ${{ needs.windows-native-test-build.outputs.archive_sha256 }}
          KIT_MANIFEST_SHA: ${{ needs.windows-native-test-build.outputs.manifest_sha256 }}
          KIT_SOURCE_SHA: ${{ needs.windows-native-test-build.outputs.source_sha }}
          KIT_SOURCE_TREE: ${{ needs.windows-native-test-build.outputs.source_tree }}
          VERIFY_OUTCOME: ${{ steps.native_verify.outcome }}
        run: |
          $root = 'C:\Users\Administrator\PlotJuggler-4.1.0-zh-test-558a\n\' + $env:KIT_SOURCE_SHA.Substring(0, 12)
          $evidence = Join-Path $env:RUNNER_TEMP 'pj-native-ci-evidence-clean'
          python -I -B ./scripts/windows/collect_native_ci_evidence.py --root $root --output $evidence `
            --source-sha $env:KIT_SOURCE_SHA --source-tree $env:KIT_SOURCE_TREE `
            --archive-sha256 $env:KIT_ARCHIVE_SHA --manifest-sha256 $env:KIT_MANIFEST_SHA `
            --scope clean --outcome $env:VERIFY_OUTCOME
          if ($LASTEXITCODE -ne 0) { throw 'Could not safely preserve independent CI evidence.' }
      - name: Upload independent CI evidence, including incomplete runs
        if: always() && steps.native_evidence.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-native-clean-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}\pj-native-ci-evidence-clean
          if-no-files-found: error
          retention-days: 7

  source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Branch, version, and translation guards
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          python3 scripts/check_branch_name.py "$SOURCE_BRANCH"
          python3 -m unittest discover -s .github/release_policy -p "test_*.py" -v
          python3 -m unittest discover -s tests -p "test_*.py" -v
          python3 scripts/test_test_sh.py
          python3 tests/check_translations_4x.py --catalog-only
          python3 tests/check_localization_provenance.py
          git diff --check

  windows-source-checks:
    # Real Windows defaults catch locale/path defects before any heavy build.
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Default-encoding source and packaging preflight
        run: |
          python -c "import locale,sys; print('default encoding:', locale.getencoding()); assert sys.flags.utf8_mode == 0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s .github/release_policy -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_translations_4x.py --catalog-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_localization_provenance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/check_windows_packaging.ps1
          git diff --check
          exit $LASTEXITCODE

  native:
    # Routine pushes and PRs run source checks only. Native builds require an
    # explicit manual dispatch or first creation of a manual-build branch.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created && startsWith(github.ref_name, 'zh-CN-4.x-ci/manual-build-'))
    needs: [source-checks, windows-source-checks]
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            qt_arch: gcc_64
            generator: Ninja
          - os: windows-2022
            qt_arch: msvc2022_64
            generator: Ninja Multi-Config
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Read pinned versions
        id: versions
        run: |
          source ./versions.env
          echo "PJ_QT_VERSION=$PJ_QT_VERSION" >> "$GITHUB_ENV"
          echo "qt_version=$PJ_QT_VERSION" >> "$GITHUB_OUTPUT"
      - name: Build tools
        run: python -m pip install 'conan>=2,<3' 'cmake>=3.28,<4' 'ninja!=1.13.0' 'aqtinstall>=3.3'
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev \
            mesa-vulkan-drivers libvulkan-dev \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libva-dev libdrm-dev \
            xvfb weston libegl-mesa0 zstd pkg-config ccache fonts-noto-cjk
          # Resolve the installed software Vulkan driver before configuring or testing.
          VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)"
          test -f "${VK_ICD_FILENAMES}"
          printf 'VK_ICD_FILENAMES=%s\n' "$VK_ICD_FILENAMES" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/cache@v5
        with:
          path: .qt
          key: zh4-qt-${{ matrix.os }}-${{ steps.versions.outputs.qt_version }}
      - name: Install pinned Linux Qt
        if: runner.os == 'Linux'
        run: ./scripts/install_qt6.sh
      - name: Install pinned Windows Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/install_qt6.ps1
      - name: Provide pinned fonts for Windows offscreen tests
        if: runner.os == 'Windows'
        # Qt's offscreen QFreeTypeFontDatabase uses QT_QPA_FONTDIR rather than
        # the native Windows font database. Keep this test-only dependency out
        # of the application and pin both its upstream revision and bytes.
        run: |
          python - <<'PYFONT'
          from pathlib import Path
          import hashlib
          import os
          import urllib.request
          base = 'https://raw.githubusercontent.com/notofonts/noto-cjk/523d033d6cb47f4a80c58a35753646f5c3608a78/'
          target = Path('build/ci-fonts').resolve()
          target.mkdir(parents=True, exist_ok=True)
          files = {
              'Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf':
                  '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b',
              'LICENSE': '6a73f9541c2de74158c0e7cf6b0a58ef774f5a780bf191f2d7ec9cc53efe2bf2',
          }
          for path, expected in files.items():
              with urllib.request.urlopen(base + path, timeout=120) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit(f'CI font checksum mismatch: {path}')
              (target / Path(path).name).write_bytes(data)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f'QT_QPA_FONTDIR={target.as_posix()}\n')
          PYFONT
      - name: Focused language build and tests
        run: |
          qt_dir="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}"
          export PATH="$qt_dir/bin:$PATH"
          python tests/check_translations_4x.py --lupdate "$qt_dir/bin/lupdate"
          cmake -S pj_app/tests/i18n -B build-i18n -G "${{ matrix.generator }}" \
            -DCMAKE_PREFIX_PATH="$qt_dir" -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build-i18n --config RelWithDebInfo --parallel 2
          ctest --test-dir build-i18n --build-config RelWithDebInfo --output-on-failure --timeout 60
      - uses: actions/cache/restore@v5
        id: conan-cache
        with:
          path: ~/.conan2
          key: zh4-conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}
          restore-keys: |
            zh4-conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}-partial-
            zh4-conan-${{ matrix.os }}-
      - name: Prepare Conan sources
        timeout-minutes: 12
        run: |
          conan profile detect --force
          ./scripts/configure_conan_remote.sh
          cache_dir="$(python -c 'import os; print(os.path.abspath(".conan-source-cache").replace(chr(92), "/"))')"
          conan_home="$(conan config home)"
          mkdir -p "$conan_home"
          python - "$conan_home/global.conf" "$cache_dir" <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import shutil
          import sys
          # Conan 2.34 trusts local cache hits without rehashing. Validate every
          # repository seed before copying any bytes into that trusted cache.
          seeds = Path('.github/conan/source-backup')
          blobs = sorted(p for p in seeds.iterdir() if re.fullmatch(r'[0-9a-f]{64}', p.name))
          for blob in blobs:
              if hashlib.sha256(blob.read_bytes()).hexdigest() != blob.name:
                  raise SystemExit(f'Conan source backup SHA256 mismatch: {blob.name}')
              metadata = json.loads(blob.with_suffix('.json').read_text(encoding='utf-8'))
              if not metadata.get('references'):
                  raise SystemExit(f'Conan source backup metadata missing references: {blob.name}')
          target = Path(sys.argv[2]) / 's'
          target.mkdir(parents=True, exist_ok=True)
          for blob in blobs:
              shutil.copy2(blob, target / blob.name)
              shutil.copy2(blob.with_suffix('.json'), target / (blob.name + '.json'))
          p = Path(sys.argv[1])
          lines = p.read_text(encoding='utf-8').splitlines() if p.exists() else []
          lines = [s for s in lines if not s.startswith(('core.sources:download_cache=', 'core.sources:download_urls='))]
          lines += [f'core.sources:download_cache={sys.argv[2]}',
                    'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]']
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python scripts/prefetch_assimp_source.py --cache-dir "$cache_dir"
      - name: Resolve exact Linux SDK and dependencies
        if: runner.os == 'Linux'
        id: conan-linux
        run: |
          python scripts/bootstrap_host_sdk.py
          conan install . --output-folder=build --build=missing \
            -r=plotjuggler-conan -r=conancenter --lockfile=conan.lock --lockfile-partial \
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 -c tools.build:jobs=2
      - name: Resolve exact Windows SDK and dependencies
        if: runner.os == 'Windows'
        id: conan-windows
        # Invoke Conan outside Git Bash. Its FFmpeg recipe launches its own
        # MSYS shell; nested shells can corrupt pkg-config's native path list.
        # https://github.com/conan-io/conan-center-index/issues/30348
        shell: pwsh
        run: |
          # setup-python injects a native path which conflicts with Conan's
          # MSYS pkg-config search path. Let the locked dependency graph own it.
          # https://github.com/conan-io/setup-conan#using-setup-python-action-alongside-setup-conan
          Remove-Item Env:PKG_CONFIG_PATH -ErrorAction SilentlyContinue
          python scripts/bootstrap_host_sdk.py
          conan install . --output-folder=build --build=missing `
            -r=plotjuggler-conan -r=conancenter --lockfile=conan.lock --lockfile-partial `
            -s build_type=RelWithDebInfo -s compiler.cppstd=20 -c tools.build:jobs=2 `
            -o 'cpython/*:shared=True' -s 'cpython/*:build_type=Release' `
            -s compiler.version=194 -c 'tools.cmake.cmaketoolchain:generator=Ninja Multi-Config'
          exit $LASTEXITCODE
      - name: Preserve FFmpeg dav1d probe diagnostics
        if: failure() && (steps.conan-linux.outcome == 'failure' || steps.conan-windows.outcome == 'failure')
        run: |
          python - <<'PYLOG'
          from pathlib import Path
          import subprocess
          home = Path(subprocess.check_output(['conan', 'config', 'home'], text=True).strip())
          output = Path('build/diagnostics')
          output.mkdir(parents=True, exist_ok=True)
          for index, path in enumerate(home.glob('p/b/ffmpe*/b/build-*/ffbuild/config.log')):
              # configure starts this log with `set`, including the complete
              # process environment. Never publish that preamble as an artifact.
              lines = path.read_text(encoding='utf-8', errors='replace').splitlines()
              probes = [i for i, line in enumerate(lines)
                        if line.startswith(('require_pkg_config libdav1d ',
                                            'check_pkg_config libdav1d '))]
              if not probes:
                  print('No dav1d probe found; the environment-bearing log is omitted.')
                  continue
              diagnostic = '\n'.join(lines[probes[-1]:][:400]) + '\n'
              (output / f'ffmpeg-{index}-dav1d-probe.log').write_text(diagnostic, encoding='utf-8')
              print(f'--- {path.name}: {path.parent.parent.name} ---')
              print(diagnostic)
          PYLOG
      - name: Trim incomplete Conan cache
        if: failure() && (steps.conan-linux.outcome == 'failure' || steps.conan-windows.outcome == 'failure')
        run: conan cache clean "*" --build --source --temp
      - name: Retain completed dependency packages for retry
        if: failure() && (steps.conan-linux.outcome == 'failure' || steps.conan-windows.outcome == 'failure')
        uses: actions/cache/save@v5
        with:
          path: ~/.conan2
          # Never mark an incomplete graph as the exact, successful closure.
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
      # Save resolved packages before application compilation/tests. A failing
      # regression must not discard a successful, expensive dependency build.
      - name: Trim Conan build cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        run: conan cache clean "*" --build --source --temp
      - uses: actions/cache/save@v5
        if: steps.conan-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}
      - name: Configure and build application plus regressions
        run: |
          cmake -S . -B build -G "${{ matrix.generator }}" \
            -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
            -DCMAKE_PREFIX_PATH="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPJ_BUILD_TESTS=ON -DPJ_BUILD_DEMOS=OFF \
            -DPJ_PLUGIN_FEEDBACK_ACCEPTANCE=ON \
            -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          cmake --build build --config RelWithDebInfo --parallel 2
      - name: Prepare verified native feedback inputs
        run: python -X utf8 packaging/localization/prepare_feedback_tests.py --build build --config RelWithDebInfo --output build/feedback-plugins
      - name: Run native tests
        run: |
          export PATH="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}/bin:$PATH"
          export PJ_GUI_ACCEPTANCE_DIR="$(python -c 'import os; print(os.path.abspath("build/gui-acceptance").replace(chr(92), "/"))')"
          export PJ_FEEDBACK_PLUGIN_DIR="$(python -c 'import os; print(os.path.abspath("build/feedback-plugins").replace(chr(92), "/"))')"
          export PJ_APBIN_TEST_DIR="$PJ_FEEDBACK_PLUGIN_DIR/ardupilot-dataflash"
          native_report="$(python -c 'import os; print(os.path.abspath("build/native-tests.xml").replace(chr(92), "/"))')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            for list in build/pj_ffmpeg_bin_dirs.txt build/pj_python_bin_dirs.txt; do
              if [[ -f "$list" ]]; then
                while IFS= read -r dir; do
                  [[ -z "$dir" ]] || export PATH="$(cygpath -u "$dir"):$PATH"
                done < "$list"
              fi
            done
          fi
          # PRE_TEST discovery launches runners even for --show-only. It needs
          # the same runtime DLL search path as the execution below.
          ctest --test-dir build --build-config RelWithDebInfo --show-only=json-v1 -R '^(PluginFeedbackMainWindow-(en_US|zh_CN|zh_TW)|PluginDisplayMetadataTest)$' > build/feedback-tests.json
          python -X utf8 packaging/localization/audit_feedback_results.py --ctest-list build/feedback-tests.json --output build/feedback-selection.json
          # Keep trailing Qt summaries in JUnit; CTest's 1 KiB default truncates
          # successful cases. The result gate still rejects truncated evidence.
          if [[ "$RUNNER_OS" == Windows ]]; then
            # Widget runners choose offscreen themselves; leave GL runners on
            # the native platform, matching upstream Windows CI.
            ctest --test-dir build --build-config RelWithDebInfo --output-on-failure --timeout 120 --test-output-size-passed 262144 --output-junit "$native_report"
          else
            PJ_REQUIRE_GPU_TESTS=1 xvfb-run -a ctest --test-dir build --output-on-failure --timeout 120 --test-output-size-passed 262144 --output-junit "$native_report"
          fi
          python -X utf8 packaging/localization/audit_feedback_results.py --junit "$native_report" --screenshots "$PJ_GUI_ACCEPTANCE_DIR" --allow-other-cases --output build/feedback-results.json
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh4-test-reports-${{ matrix.os }}
          path: |
            build-i18n/Testing/Temporary/
            build/Testing/Temporary/
            build/native-tests.xml
            build/rhi-window-*.xml
            build/feedback-tests.json
            build/feedback-selection.json
            build/feedback-results.json
            build/feedback-plugins-identity.json
            build/diagnostics/
            build/gui-acceptance/
          if-no-files-found: ignore
          retention-days: 14
