name: Isolated Qt5 caption scaling diagnostic
'on':
  push:
    branches: [fix/scaled-caption-determinism]
    paths:
    - tests/image-tools/**
    - plotjuggler_app/resource_image.*
    - .github/workflows/zh-scaling-diagnostic.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-22.04
    container: ubuntu:22.04
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    defaults:
      run:
        shell: bash
    steps:
    - run: |
        apt-get update
        DEBIAN_FRONTEND=noninteractive apt-get install -y cmake build-essential git ca-certificates python3 qtbase5-dev
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Fetch exact image37 reference without running any package
      run: |
        python3 - <<'PY'
        from pathlib import Path
        import urllib.request,hashlib
        p=Path('reference/zh_CN/meme_37.png');p.parent.mkdir(parents=True,exist_ok=True)
        data=urllib.request.urlopen('https://raw.githubusercontent.com/reliable-ly0411/PlotJuggler-zh-CN/3117288ce8d710bde4f7a86ca5ed5240ebb1c301/plotjuggler_app/resources/memes/zh_CN/meme_37.png',timeout=60).read()
        assert hashlib.sha256(data).hexdigest()=='9f0fed3e1a6d97ce971ea63f59eac05cf3c1da446e18fc4b0f35707b6c0837df'
        p.write_bytes(data)
        PY
    - name: Compile standalone production Qt5 helper and probe
      run: |
        cmake -S tests/image-tools -B probe-build -DPJ_IMAGE_TOOLS_QT_MAJOR=5 -DCMAKE_BUILD_TYPE=Release
        cmake --build probe-build --target scaling_probe --parallel 2
    - name: Reproduce exact pixels across CPU and thread paths
      env:
        QT_QPA_PLATFORM: offscreen
      run: |
        failed=0
        for profile in default no-sse41 no-avx2 serial; do
          export QT_NO_CPU_FEATURE=''
          export PJ_SCALE_THREADS=0
          case "$profile" in
            no-sse41) export QT_NO_CPU_FEATURE='sse4.1 avx2' ;;
            no-avx2) export QT_NO_CPU_FEATURE='avx2' ;;
            serial) export PJ_SCALE_THREADS=1 ;;
          esac
          probe-build/scaling_probe plotjuggler_app/resources/memes reference "diagnostic/$profile" 37 || failed=1
        done
        exit "$failed"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: caption37-replica-${{ matrix.replica }}-${{ github.sha }}
        path: diagnostic/
        if-no-files-found: error
        retention-days: 14
