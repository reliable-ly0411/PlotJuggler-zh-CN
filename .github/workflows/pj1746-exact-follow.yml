# SPDX-License-Identifier: MPL-2.0
# Recovery only: exact earlier production evidence, new acceptance build, no product writes.
name: '#1746 acceptance retry with retained production proof (validation only)'
'on':
  push:
    branches:
    - zh-CN-4.x-test/1746-exact-follow-20261126
permissions:
  contents: read
  actions: read
concurrency:
  group: pj1746-acceptance-readback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  wasm-acceptance-readback:
    name: ${{ matrix.lane }} (WASM acceptance readback)
    runs-on: ubuntu-22.04
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        include:
        - lane: upstream-pr
          sha: 0e65cbd1686c9819327872fe0193767f227ec871
          tree: 2f537d43f230c2a97c49a20d466b4b14bb1d5427
          parents: 92a4d31c8a3b66386c17b69ac7515552be028f86
    env:
      PJ_LANE: ${{ matrix.lane }}
      PJ_PRODUCT_SHA: ${{ matrix.sha }}
      PJ_PRODUCT_TREE: ${{ matrix.tree }}
      PJ_PRODUCT_PARENTS: ${{ matrix.parents }}
    steps:
    - name: Free up runner disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
        sudo docker image prune --all --force >/dev/null 2>&1 || true
        df -h /
    - name: Use HTTPS for github.com submodules
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"
    - name: Checkout exact product (not controller)
      uses: actions/checkout@v6
      with:
        ref: ${{ matrix.sha }}
        submodules: recursive
        repository: reliable-ly0411/PlotJuggler-zh-CN
        persist-credentials: false
    - name: Verify immutable product commit, tree, parents and submodules
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$PJ_PRODUCT_SHA"
        test "$(git rev-parse 'HEAD^{tree}')" = "$PJ_PRODUCT_TREE"
        actual_parents="$(git cat-file commit HEAD | sed -n 's/^parent //p; /^$/q' | paste -sd ' ' -)"
        printf 'Exact checkout: SHA=%s tree=%s parents=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$actual_parents"
        test "$actual_parents" = "$PJ_PRODUCT_PARENTS"
        mkdir -p candidate-evidence
        git submodule status --recursive > candidate-evidence/submodules.txt
        ! grep -Eq '^[-+U]' candidate-evidence/submodules.txt
        python3 - <<'PY_RECEIPT'
        import json, os
        from pathlib import Path
        record = {n: os.environ[e] for n,e in (
            ('lane', 'PJ_LANE'), ('source_sha', 'PJ_PRODUCT_SHA'), ('source_tree', 'PJ_PRODUCT_TREE'),
            ('parents', 'PJ_PRODUCT_PARENTS'), ('controller_sha', 'GITHUB_SHA'),
            ('repository', 'GITHUB_REPOSITORY'), ('run_id', 'GITHUB_RUN_ID'),
            ('run_attempt', 'GITHUB_RUN_ATTEMPT'))}
        assert record['source_sha'] != record['controller_sha']
        Path('candidate-evidence/identity.json').write_text(json.dumps(record, indent=2)+'\n')
        print(json.dumps(record, indent=2))
        PY_RECEIPT
    - name: Checkout controller evidence helper
      uses: actions/checkout@v6
      with:
        ref: ${{ github.sha }}
        path: .ci-controller
        persist-credentials: false
    - name: Read the same lane's production evidence from the immutable full run
      uses: actions/download-artifact@v4
      with:
        github-token: ${{ github.token }}
        run-id: '45785663790'
        name: pj1746-${{ matrix.lane }}-wasm-${{ matrix.sha }}-1
        path: retained-evidence
    - name: Require retained production provenance and recheck the original budget
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build-wasm-prod/deploy
        python3 - <<'PY_RECEIPT'
        import hashlib, json, os, shutil
        from pathlib import Path
        root=Path('retained-evidence/candidate-evidence')
        ident=json.loads((root/'identity.json').read_text())
        prod=json.loads((root/'production.json').read_text())
        for key, expected in {
            'lane': os.environ['PJ_LANE'],
            'source_sha': os.environ['PJ_PRODUCT_SHA'],
            'source_tree': os.environ['PJ_PRODUCT_TREE'],
            'parents': os.environ['PJ_PRODUCT_PARENTS'],
            'controller_sha': 'ee52f123dc6a0adf5d97a1e94b3284355e65c42c',
            'repository': 'reliable-ly0411/PlotJuggler-zh-CN',
            'run_id': '45785663790', 'run_attempt': '1',
        }.items():
            assert ident[key] == prod[key] == expected, (key, ident[key], prod[key])
        assert prod['kind']=='production'
        manifest=root/'production-manifest.json'
        contents=manifest.read_bytes()
        assert prod['package']['files']['manifest.json'] == {
            'bytes': len(contents), 'sha256': hashlib.sha256(contents).hexdigest(),
        }
        assert json.loads(contents)['bundleId'] == prod['package']['bundle_id']
        assert hashlib.sha256(contents).hexdigest() == 'ff74f414e7bea1e780158302f635e05f4c4a014af664a18511ef2154774245b5'
        assert prod['package']['startup_bytes'] == 16664047
        assert prod['package']['bundle_id'] == 'sha256-ea7fed7672c2669e51363515a1de8019'

        assert 'PJ_WASM_ENABLE_INGRESS_PROBE:BOOL=OFF' in (root/'production-CMakeCache.txt').read_text().splitlines()
        shutil.copyfile(manifest,'build-wasm-prod/deploy/manifest.json')
        for path in [manifest,root/'production.json']:
            shutil.copyfile(path, Path('candidate-evidence')/('retained-'+path.name))
        print('Re-used verified production package manifest from run 45785663790:', prod['package']['bundle_id'])
        PY_RECEIPT
    - name: Read toolchain versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        source ./versions.env
        for name in PJ_QT_VERSION PJ_EMSCRIPTEN_VERSION PJ_WASM_NODE_VERSION; do
          echo "${name}=${!name}" >> "${GITHUB_ENV}"
        done
        echo "wasm_qt=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "emscripten=${PJ_EMSCRIPTEN_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "node=${PJ_WASM_NODE_VERSION}" >> "${GITHUB_OUTPUT}"
    - name: Install pinned packaging runtime
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.versions.outputs.node }}
    - name: Apply unmodified upstream 20,000,000 byte startup and localized 26,000,000 byte total gates
      shell: bash
      run: |
        set -euo pipefail
        manifest=build-wasm-prod/deploy/manifest.json
        case "$PJ_LANE" in
          localized) node scripts/wasm_localized_size_budget.mjs "$manifest" ;;
          upstream-pr) node scripts/wasm_size_budget.mjs "$manifest" 20000000 ;;
          *) exit 9 ;;
        esac
    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ccache ninja-build python3-pip make pkg-config
        # Scene2D video cross-compiles dav1d, whose build system is meson.
        python3 -m pip install --user meson
        # Runtime libraries for the desktop host Qt tools (qsb bakes the QRhi
        # shaders offline and transitively links the full Qt GUI stack, even
        # headless). The lean runner ships none of these, so qsb would die at
        # load time with exit 127.
        sudo apt-get install -y --no-install-recommends \
          libgl1 libegl1 libfontconfig1 libfreetype6 libxkbcommon0 \
          libx11-6 libxcb1 libglib2.0-0 libdbus-1-3
    - name: Cache Qt WebAssembly and host kits
      id: qt-cache
      uses: actions/cache@v5
      with:
        path: .qt-wasm
        key: qt-wasm-${{ steps.versions.outputs.wasm_qt }}-multithread-shadertools-v1
    - name: Install Qt WebAssembly and host kits
      if: steps.qt-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --user 'aqtinstall==3.3.0'
        "${HOME}/.local/bin/aqt" install-qt linux desktop \
          "${PJ_QT_VERSION}" linux_gcc_64 --outputdir .qt-wasm \
          -m qtshadertools
        "${HOME}/.local/bin/aqt" install-qt all_os wasm \
          "${PJ_QT_VERSION}" wasm_multithread --outputdir .qt-wasm \
          -m qtshadertools
    - name: Cache Emscripten SDK
      id: emsdk-cache
      uses: actions/cache@v5
      with:
        path: .emsdk
        key: emsdk-${{ steps.versions.outputs.emscripten }}-linux-x64-v1
    - name: Install Emscripten SDK
      if: steps.emsdk-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth 1 --branch "${PJ_EMSCRIPTEN_VERSION}" \
          https://github.com/emscripten-core/emsdk.git .emsdk
        .emsdk/emsdk install "${PJ_EMSCRIPTEN_VERSION}"
        .emsdk/emsdk activate "${PJ_EMSCRIPTEN_VERSION}"
    - name: Restore WebAssembly compiler cache
      id: ccache_restore
      uses: actions/cache/restore@v5
      with:
        path: ~/.cache/ccache
        key: ccache-1746-${{ matrix.lane }}-${{ matrix.sha }}
        restore-keys: |
          ccache-1746-${{ matrix.lane }}-
          ccache-zh4-localized-
          ccache-wasm-ci-
    - name: Configure compiler cache
      run: |
        ccache --set-config=max_size=4G
        ccache --set-config=compression=true
        ccache --set-config=compiler_check=content
        ccache --set-config=hash_dir=false
        ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
        ccache --zero-stats
    - name: Cache the WebAssembly CPython build
      uses: actions/cache@v5
      with:
        path: ~/.cache/pj-wasm-cpython
        key: wasm-cpython-${{ hashFiles('cmake/PjWasmPython.cmake', 'cmake/wasm_python/**') }}-emsdk-${{ steps.versions.outputs.emscripten
          }}
    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ hashFiles('tests/wasm/package-lock.json') }}
    - name: Install browser package and Chromium
      shell: bash
      run: |
        set -euo pipefail
        cd tests/wasm
        npm ci
        npx playwright install --with-deps chromium
    - name: Build the exact product acceptance application with the existing ingress probes
      shell: bash
      run: |
        set -euo pipefail
        source .emsdk/emsdk_env.sh >/dev/null
        cmake -S . -B build-wasm-probe -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="${PWD}/.qt-wasm/${PJ_QT_VERSION}/wasm_multithread/lib/cmake/Qt6/qt.toolchain.cmake" \
          -DQT_HOST_PATH="${PWD}/.qt-wasm/${PJ_QT_VERSION}/gcc_64" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
          -DPJ_BUILD_TESTS=OFF -DPJ_BUILD_DEMOS=OFF -DPJ_WASM_ENABLE_INGRESS_PROBE=ON \
          -DPJ_WASM_SCENE3D_CAPABILITY_PROBE=ON \
          -DPJ_WASM_WITH_SCENE2D=ON -DPJ_WASM_WITH_SCENE3D=ON -DPJ_WASM_WITH_PYTHON=ON \
          -DPJ_WASM_PYTHON_CACHE_DIR="${HOME}/.cache/pj-wasm-cpython"
        cmake --build build-wasm-probe --target pj_app --parallel 2
        node scripts/package_wasm.mjs --source build-wasm-probe/pj_app --output build-wasm-probe/deploy
        cp build-wasm-probe/deploy/manifest.json candidate-evidence/acceptance-manifest.json
        cp build-wasm-probe/CMakeCache.txt candidate-evidence/acceptance-CMakeCache.txt
    - name: Record acceptance package identity and verify all representations
      shell: bash
      run: |
        set -euo pipefail
        python3 - <<'PY_MANIFEST'
        import importlib.util, json
        from pathlib import Path
        path = Path('.ci-controller/packaging/localization/wasm_receipt.py')
        spec = importlib.util.spec_from_file_location('receipt', path)
        m = importlib.util.module_from_spec(spec)
        spec.loader.exec_module(m)
        root = Path('candidate-evidence')
        record = json.loads((root/'identity.json').read_text())
        record['package'] = m.package_record(Path('build-wasm-probe/deploy'))
        record['kind'] = 'acceptance'
        (root/'acceptance.json').write_text(json.dumps(record, indent=2) + '\n')
        PY_MANIFEST
    - name: Retain verified acceptance bytes even when a browser assertion fails
      uses: actions/upload-artifact@v4
      with:
        name: pj1746-${{ matrix.lane }}-acceptance-package-${{ matrix.sha }}-${{ github.run_attempt }}
        path: |
          build-wasm-probe/deploy
          candidate-evidence/acceptance.json
        include-hidden-files: true
        compression-level: 0
        if-no-files-found: error
        retention-days: 14
    - name: Run existing Qt-in-Chromium Chinese text and glyph assertions unchanged
      shell: bash
      run: |
        set -euo pipefail
        node scripts/serve_wasm.mjs --root build-wasm-probe/deploy --port 6931 > candidate-evidence/browser-server.log 2>&1 &
        server=$!
        trap 'kill "$server" 2>/dev/null || true' EXIT
        # The versioned application HTML name is a build-root file, not a deploy route.
        entrypoint=$(jq -er '.entrypoint | select(. == "index.html")' build-wasm-probe/deploy/manifest.json)
        test -f "build-wasm-probe/deploy/$entrypoint"
        export PJ_WASM_URL="http://127.0.0.1:6931/$entrypoint"
        export PJ_WASM_BUILD_DIR="$PWD/build-wasm-probe"
        for _ in $(seq 1 50); do
          curl -fsS -o /dev/null "$PJ_WASM_URL" && break
          sleep 0.2
        done
        curl -fsS -o /dev/null "$PJ_WASM_URL"
        export PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/candidate-evidence/chinese-browser.json"
        export PJ_BROWSER_OUTPUT="$PWD/candidate-evidence/chinese-artifacts"
        cd tests/wasm
        case "$PJ_LANE" in
          localized) npx playwright test --config log_widget.playwright.config.js --workers=1 \
            --grep 'real browser starts with the zh_(CN|TW) built-in Log tooltip$' \
            --reporter=line,json --output "$PJ_BROWSER_OUTPUT" ;;
          upstream-pr) npx playwright test cjk_fonts.spec.js --project=chromium --workers=1 \
            --reporter=line,json --output "$PJ_BROWSER_OUTPUT" ;;
          *) exit 9 ;;
        esac
        cd ../..
        python3 - <<'PY_CASES'
        import json
        from pathlib import Path
        data = json.loads(Path('candidate-evidence/chinese-browser.json').read_text())
        stats = data['stats']
        assert stats['expected'] == 2 and stats['unexpected'] == stats['skipped'] == stats['flaky'] == 0, stats
        PY_CASES
    - name: Retain immutable identity, production and acceptance manifests, browser receipts/screenshots
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: pj1746-${{ matrix.lane }}-acceptance-evidence-${{ matrix.sha }}-${{ github.run_attempt }}
        path: |
          candidate-evidence
          tests/wasm/test-results
        if-no-files-found: error
        retention-days: 14
