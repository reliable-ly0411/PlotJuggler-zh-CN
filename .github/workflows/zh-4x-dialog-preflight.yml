name: Chinese rc.2 file-dialog platform preflight
on:
  push:
    branches: ['zh-CN-4.x-ci/dialog-preflight-rc2-final8']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dialog:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created && github.ref_name == 'zh-CN-4.x-ci/dialog-preflight-rc2-final8')
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Qt-only build tools
        run: python -m pip install 'cmake>=3.28,<4' 'ninja!=1.13.0'
      - name: Install pinned Qt
        run: ./scripts/windows/install_qt6.ps1
      - name: Compile actual file-dialog production sources, no application or Conan build
        run: |
          $version = ((Get-Content versions.env | Select-String '^PJ_QT_VERSION=').Line -split '=',2)[1]
          $qt = Join-Path $PWD ".qt/$version/msvc2022_64"
          $env:PATH = "$qt/bin;$env:PATH"
          cmake -S pj_widgets/tests/standalone -B build-dialog -G 'Ninja Multi-Config' "-DCMAKE_PREFIX_PATH=$qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-dialog --config RelWithDebInfo --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-dialog -C RelWithDebInfo --output-on-failure --no-tests=error --timeout 60
          exit $LASTEXITCODE
      - name: Preserve exact link classifications and regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-file-dialog-preflight
          path: |
            build-dialog/file-dialog.txt
            build-dialog/Testing/Temporary/
          if-no-files-found: warn
