# One-shot recovery of the existing empty rc.2 draft. No application rebuild,
# no generic retry/overwrite, no old tag/release modification. Controller source
# differs only by these recovery files; application checkout stays at final8.
name: Resume exact rc2 empty draft
on:
  push:
    branches: ['zh-CN-4.x-ci/resume-rc2-draft-420226107']
permissions:
  contents: read
concurrency:
  group: publish-zh4
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'reliable-ly0411/PlotJuggler-zh-CN' && github.event_name == 'push' && github.event.created && github.ref == 'refs/heads/zh-CN-4.x-ci/resume-rc2-draft-420226107'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: accepted
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 09487081b7dc144c1bfaf674c4a08769e12538ad
      RELEASE_TAG: v4.0.0-zh.1.rc.2
      CANDIDATE_RUN: '39694431705'
      CANDIDATE_ATTEMPT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Validate the isolated recovery controller before any remote write
        working-directory: controller
        run: |
          set -euo pipefail
          python3 tests/test_resume_rc2_draft.py
          python3 - <<'PYCODE'
          import subprocess
          actual = set(subprocess.check_output(['git', 'diff', '--name-only',
              '09487081b7dc144c1bfaf674c4a08769e12538ad', 'HEAD'], text=True).splitlines())
          assert actual == {'.github/workflows/zh-4x-resume-rc2.yml',
                            'packaging/localization/resume_rc2_draft.py', 'tests/test_resume_rc2_draft.py'}
          PYCODE
      - uses: actions/checkout@v6
        with:
          ref: 09487081b7dc144c1bfaf674c4a08769e12538ad
          path: accepted
          fetch-depth: 0
          persist-credentials: false
      - name: Verify accepted source, run and stable promotion
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = reliable-ly0411/PlotJuggler-zh-CN
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_TAG" =~ ^v4\.[0-9]+\.[0-9]+-zh\.[1-9][0-9]*\.rc\.[1-9][0-9]*$ ]]
          git fetch origin zh-CN-4.x
          git merge-base --is-ancestor "$SOURCE_SHA" origin/zh-CN-4.x
          test "$(git rev-parse "$SOURCE_SHA^{tree}")" = "$(git rev-parse origin/zh-CN-4.x^{tree})"
          test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "$SOURCE_SHA^{tree}")"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > run.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('run.json', encoding='utf-8'))
          assert r['status'] == 'completed' and r['conclusion'] == 'success'
          assert r['head_sha'] == os.environ['SOURCE_SHA']
          assert str(r['run_attempt']) == os.environ['CANDIDATE_ATTEMPT']
          assert r['path'] == '.github/workflows/zh-4x-packages.yml'
          assert r['event'] in ['push', 'workflow_dispatch']
          assert r['repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          PY
          version=$(sed -n 's/^PJ_APP_VERSION=//p' versions.env)
          test "$RELEASE_TAG" = "v$version"
          # This is NOT a general existing-tag retry. Only the exact tag and
          # unique empty draft left by failed run39707711333 may continue.
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > existing-tag.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39707711333" > failed-publication-run.json
          git ls-remote --tags --refs origin > tags-before.txt
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases-before.json
          python3 packaging/localization/snapshot_latest.py "$GITHUB_REPOSITORY" latest-before.json
      - name: Download and verify the original accepted packages
        run: |
          set -euo pipefail
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" \
            -n zh4-candidate-Linux -n zh4-candidate-Windows -D candidate
          (cd candidate/zh4-candidate-Linux && sha256sum -c SHA256SUMS-Linux.txt)
          (cd candidate/zh4-candidate-Windows && sha256sum -c SHA256SUMS-Windows.txt)
          gh run download "$CANDIDATE_RUN" --repo "$GITHUB_REPOSITORY" -n zh4-release-manifest -D acceptance
          mkdir dist
          cp candidate/zh4-candidate-Linux/*.AppImage candidate/zh4-candidate-Linux/*.deb \
             candidate/zh4-candidate-Windows/*.exe dist/
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess, sys
          sys.path.insert(0, 'packaging/localization')
          from release_assets import stage_public_assets
          version = os.environ['RELEASE_TAG'][1:]
          mapped = json.loads(subprocess.check_output(['python3', 'packaging/localization/version_map.py', version]))
          expected = {f'PlotJuggler-{version}-Windows-x64-zh-CN.exe',
                      f'PlotJuggler-{version}-x86_64-zh-CN.AppImage',
                      f'plotjuggler4_{mapped["deb"]}_amd64-zh-CN.deb'}
          assert {x.name for x in Path('dist').iterdir()} == expected
          manifest = json.loads(Path('acceptance/release-manifest.json').read_text(encoding='utf-8'))
          assert manifest['schema_version'] == 1 and manifest['automated_acceptance'] == 'passed'
          assert manifest['source_commit'] == manifest['workflow_sha'] == os.environ['SOURCE_SHA']
          assert manifest['source_tree'] == subprocess.check_output(['git', 'rev-parse', os.environ['SOURCE_SHA'] + '^{tree}'], text=True).strip()
          assert manifest['run_id'] == os.environ['CANDIDATE_RUN']
          assert manifest['run_attempt'] == os.environ['CANDIDATE_ATTEMPT']
          assert manifest['version'] == version and manifest['tag'] == os.environ['RELEASE_TAG']
          assert len(manifest['acceptance_reports']) == 5 and len(manifest['screenshots']) == 10
          assert {a['name'] for a in manifest['assets']} == expected
          public_assets = stage_public_assets(Path('dist'), Path('release-assets'), manifest['assets'])
          Path('public-asset-manifest.json').write_text(json.dumps({
              'source_commit': manifest['source_commit'], 'run_id': manifest['run_id'],
              'run_attempt': manifest['run_attempt'], 'assets': public_assets}, indent=2) + '\n', encoding='utf-8')
          baseline = json.loads(Path('docs/localization/upstream-baseline.json').read_text(encoding='utf-8'))
          body = Path('docs/localization/RELEASE-' + version + '.md').read_text(encoding='utf-8')
          replacements = {'SOURCE_SHA': os.environ['SOURCE_SHA'],
                          'SOURCE_TREE': subprocess.check_output(['git', 'rev-parse', os.environ['SOURCE_SHA'] + '^{tree}'], text=True).strip(),
                          'BIN_SHA': baseline['ardupilot_plugin']['commit'],
                          'BIN_VERSION': baseline['ardupilot_plugin']['version'],
                          'RUN_ID': os.environ['CANDIDATE_RUN'],
                          'RUN_URL': json.load(open('run.json', encoding='utf-8'))['html_url'],
                          'ASSET_TABLE': '| 文件 | 字节数 | SHA-256 |\n| --- | ---: | --- |\n' +
                              '\n'.join(f"| `{a['name']}` | {a['size']} | `{a['sha256']}` |" for a in public_assets)}
          for key, value in replacements.items(): body = body.replace('@' + key + '@', value)
          assert all('@' + key + '@' not in body for key in replacements)
          # Render an absolute source link suitable for a GitHub Release body.
          body = body.replace('../../blob/', 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/blob/')
          # Change only literal download filenames, not Debian's ordered version.
          for asset in public_assets:
              body = body.replace('`' + asset['candidate_name'] + '`', '`' + asset['name'] + '`')
          Path('release-notes.md').write_text(body, encoding='utf-8')
          PY
          python3 packaging/localization/hash_packages.py release-assets --output SHA256SUMS.txt
      - name: Continue only the exact previously created empty draft
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .run_attempt)" = "$CANDIDATE_ATTEMPT"
          gh api "repos/$GITHUB_REPOSITORY/releases/420226107" > draft-created.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases-current.json
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > existing-tag.json
          python3 ../controller/packaging/localization/resume_rc2_draft.py empty draft-created.json \
            releases-current.json release-notes.md existing-tag.json failed-publication-run.json
          upload_url=$(python3 - <<'PY'
          import json, os
          r = json.load(open('draft-created.json'))
          assert r['draft'] and r['prerelease'] and r['tag_name'] == os.environ['RELEASE_TAG']
          assert not r['assets']
          url = r['upload_url'].split('{', 1)[0]
          assert url == f"https://uploads.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/{r['id']}/assets"
          print(url)
          PY
          )
          mkdir upload-responses
          for asset in release-assets/*; do
            name=$(basename "$asset")
            # Public-safe names need no query escaping. Retain the actual upload
            # response: a successful HTTP upload alone does not prove the name.
            gh api --method POST "$upload_url?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$asset" > "upload-responses/$name.json"
          done
      - name: Verify actual draft names and bytes before publication
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/420226107" > draft-release.json
          python3 packaging/localization/release_assets.py release-assets draft-release.json \
            --upload-responses upload-responses --tag "$RELEASE_TAG" --state draft --notes release-notes.md
          python3 ../controller/packaging/localization/resume_rc2_draft.py download draft-release.json draft-check
          (cd draft-check && sha256sum -c SHA256SUMS.txt)
          gh api "repos/$GITHUB_REPOSITORY/releases/420226107" > draft-release.json
          python3 packaging/localization/release_assets.py release-assets draft-release.json \
            --upload-responses upload-responses --tag "$RELEASE_TAG" --state draft --notes release-notes.md \
            --downloads draft-check
      - name: Publish only the verified draft
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" --jq .run_attempt)" = "$CANDIDATE_ATTEMPT"
          # Refresh and reverify before the only publication mutation.
          gh api "repos/$GITHUB_REPOSITORY/releases/420226107" > draft-release.json
          python3 packaging/localization/release_assets.py release-assets draft-release.json \
            --upload-responses upload-responses --tag "$RELEASE_TAG" --state draft --notes release-notes.md \
            --downloads draft-check
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > existing-tag.json
          python3 - <<'PYCODE'
          import json, sys
          sys.path.insert(0, '../controller/packaging/localization')
          from resume_rc2_draft import validate_tag
          validate_tag(json.load(open('existing-tag.json', encoding='utf-8')))
          PYCODE
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/420226107" \
            -F draft=false -F prerelease=true -f make_latest=false > publish-response.json
      - name: Re-download and verify publication without touching older releases
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" -D public-check
          (cd public-check && sha256sum -c SHA256SUMS.txt)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > public-release.json
          python3 packaging/localization/release_assets.py release-assets public-release.json \
            --upload-responses upload-responses --tag "$RELEASE_TAG" --state published --notes release-notes.md \
            --downloads public-check
          git ls-remote --tags --refs origin > tags-after.txt
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases-after.json
          python3 packaging/localization/snapshot_latest.py "$GITHUB_REPOSITORY" latest-after.json
          python3 - <<'PY'
          import json, os
          def tags(path):
              return {line.split()[1]: line.split()[0] for line in open(path) if line.strip()}
          old_tags, new_tags = tags('tags-before.txt'), tags('tags-after.txt')
          assert old_tags == new_tags  # Recovery creates/moves/deletes no tags.
          assert new_tags['refs/tags/' + os.environ['RELEASE_TAG']] == os.environ['SOURCE_SHA']
          assert json.load(open("latest-before.json"))["id"] == json.load(open("latest-after.json"))["id"]
          before = json.load(open('releases-before.json'))
          after = json.load(open('releases-after.json'))
          def inventory(r):
              return (r['id'], r['tag_name'], r['name'], r['body'], r['draft'], r['prerelease'], r['updated_at'], [(a['id'], a['name'], a['size'], a.get('digest'), a['updated_at']) for a in r['assets']])
          current = {r['id']: inventory(r) for r in after}
          for old in before:
              if old['id'] != 420226107: assert current[old['id']] == inventory(old)
          new = [r for r in after if r['tag_name'] == os.environ['RELEASE_TAG']]
          assert len(new) == 1 and new[0]['id'] == 420226107 and new[0]['prerelease'] and not new[0]['draft']
          print(new[0]['html_url'])
          PY
      - name: Retain publication verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zh4-publication-verification
          path: |
            accepted/acceptance/release-manifest.json
            accepted/public-asset-manifest.json
            accepted/upload-responses/
            accepted/draft-created.json
            accepted/draft-release.json
            accepted/public-release.json
            accepted/release-notes.md
            accepted/existing-tag.json
            accepted/failed-publication-run.json
            accepted/releases-before.json
            accepted/releases-after.json
            accepted/tags-before.txt
            accepted/tags-after.txt
            accepted/latest-before.json
            accepted/latest-after.json
            accepted/publish-response.json
          if-no-files-found: error
