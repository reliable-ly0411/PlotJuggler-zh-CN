            2>&1 | tee "$evidence/conan.log"
      - name: Build only the Scene3D RHI test executable and its dependencies
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pj4-sync-da8a7eef-rhi"
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TEST_TREE"
          git diff --exit-code HEAD
          qt="$(realpath .qt/6.12.0/gcc_64)"
          cmake -S . -B build -G Ninja \
