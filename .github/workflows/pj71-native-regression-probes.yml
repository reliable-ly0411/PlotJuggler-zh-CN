          grep -q '^TEST_F(Scene3dRhiRenderTest, OrientationTextureMarkedCornerStaysTopLeft)' \
            pj_scene3D/widgets/tests/scene3d_rhi_render_test.cpp
          test "$(git rev-parse HEAD:pj_scene3D/widgets/rhi/shaders/model.frag)" = a3044db1d44b2445f053344ab9839efee06be3d1
          test "$(git rev-parse HEAD:pj_scene3D/widgets/rhi/shaders/model.frag.qsb)" = 7dbb4359b19aaf45134861872e861247fd94254e
          cmake --build build --target scene3d_rhi_render_test --parallel 2 2>&1 | tee "$evidence/build.log"
