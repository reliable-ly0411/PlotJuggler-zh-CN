            ${{ runner.temp }}/pj4-sync-da8a7eef-rhi/submodules.txt
            ${{ runner.temp }}/pj4-sync-da8a7eef-rhi/vulkan-device.txt
            ${{ runner.temp }}/pj4-sync-da8a7eef-rhi/discovery.log
            ${{ runner.temp }}/pj4-sync-da8a7eef-rhi/gtest.xml
            ${{ runner.temp }}/pj4-sync-da8a7eef-rhi/test.log
          retention-days: 7

