        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/pj4-sync-da8a7eef-rhi"
          test "$(git rev-parse HEAD)" = "$TEST_SOURCE"
          test "$(git rev-parse 'HEAD^{tree}')" = "$TEST_TREE"
          git diff --exit-code HEAD
          mapfile -t icds < <(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' -print)
          test "${#icds[@]}" -eq 1
          export VK_DRIVER_FILES="${icds[0]}" VK_ICD_FILENAMES="${icds[0]}"
          xvfb-run -a vulkaninfo --summary > "$evidence/vulkan-device.txt"
          grep -Ei 'deviceType *= *PHYSICAL_DEVICE_TYPE_CPU' "$evidence/vulkan-device.txt"
          grep -Ei 'deviceName *= *(llvmpipe|lavapipe)' "$evidence/vulkan-device.txt"
          mapfile -t bins < <(find build -type f -executable -name scene3d_rhi_render_test -print)
          test "${#bins[@]}" -eq 1
          exact='Scene3dRhiRenderTest.OrientationTextureMarkedCornerStaysTopLeft'
          xvfb-run -a "${bins[0]}" --gtest_filter="$exact" --gtest_list_tests | tee "$evidence/discovery.log"
          grep -Fx '  OrientationTextureMarkedCornerStaysTopLeft' "$evidence/discovery.log"
          QT_LOGGING_RULES='qt.rhi.*=true' xvfb-run -a "${bins[0]}" --gtest_filter="$exact" \
            --gtest_output="xml:$evidence/gtest.xml" 2>&1 | tee "$evidence/test.log"
          python3 - "$evidence/gtest.xml" "$exact" <<'PY_RESULT'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = root.findall('.//testcase')
          assert len(cases) == 1
          case = cases[0]
          assert case.attrib['classname'] + '.' + case.attrib['name'] == sys.argv[2]
          assert case.attrib['status'] == 'run' and case.attrib.get('result') == 'completed'
          assert not [tag for tag in ('failure', 'error', 'skipped') if case.find(tag) is not None]
          print(sys.argv[2] + ' ran once and passed; Lavapipe CPU device verified.')
          PY_RESULT
