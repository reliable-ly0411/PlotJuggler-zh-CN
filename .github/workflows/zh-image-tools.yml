name: Isolated image compatibility and benchmark tools
'on':
  push:
    branches: [zh4/resource-overlays]
    paths:
    - .github/workflows/zh-image-tools.yml
    - tests/image-tools/**
    - tests/resource_image_test.cpp
    - plotjuggler_app/resource_image.*
    - scripts/prepare_image_benchmarks.py
    - scripts/export_generic_resource_patch.py
  pull_request:
    branches: [zh-CN]
    paths:
    - .github/workflows/zh-image-tools.yml
    - tests/image-tools/**
    - tests/resource_image_test.cpp
    - plotjuggler_app/resource_image.*
    - scripts/prepare_image_benchmarks.py
    - scripts/export_generic_resource_patch.py
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  qt6-generic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Qt GUI dependencies
      run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0
    - uses: jurplel/install-qt-action@v4
      with:
        version: 6.11.1
        cache: true
    - name: Compile generic helper with upstream Qt and C++ standard
      run: |
        cmake -S tests/image-tools -B build-image-qt6 -DCMAKE_BUILD_TYPE=Release -DPJ_IMAGE_TOOLS_QT_MAJOR=6
        cmake --build build-image-qt6 --parallel 2
        ctest --test-dir build-image-qt6 --output-on-failure --no-tests=error
    - name: Apply and compile the minimal patch on pinned real upstream
      run: |
        python3 scripts/export_generic_resource_patch.py --out generic-resource-variant.patch
        git clone --depth=1 --filter=blob:none --no-checkout --single-branch --branch main-4.x https://github.com/PlotJuggler/PlotJuggler.git upstream-proof
        git -C upstream-proof fetch --depth=1 origin 0345ec513bde7f05ad3148548ac30401f2b6f7a7
        git -C upstream-proof read-tree 0345ec513bde7f05ad3148548ac30401f2b6f7a7
        git -C upstream-proof apply --index --check "$PWD/generic-resource-variant.patch"
        git -C upstream-proof apply --index "$PWD/generic-resource-variant.patch"
        cmake -S upstream-proof/pj_app/tests/resource_image_variant -B upstream-generic -DCMAKE_BUILD_TYPE=Release
        cmake --build upstream-generic --parallel 2
        ctest --test-dir upstream-generic --output-on-failure --no-tests=error
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Qt6-CoreGui-compatibility-${{ github.sha }}
        path: |
          build-image-qt6/Testing/Temporary/
          upstream-generic/Testing/Temporary/
          generic-resource-variant.patch
        if-no-files-found: warn
  windows-benchmark-tools:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: jurplel/install-qt-action@v4
      with:
        version: 5.15.2
        arch: win64_msvc2019_64
        cache: true
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Prepare exact pinned image implementations and resources
      shell: pwsh
      run: |
        git fetch --no-tags --depth=1 https://github.com/reliable-ly0411/PlotJuggler-zh-CN.git 3117288ce8d710bde4f7a86ca5ed5240ebb1c301
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        python scripts/prepare_image_benchmarks.py --out bench-inputs
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Compile standalone Qt5 benchmark executables
      shell: pwsh
      run: |
        cmake -S tests/image-tools -B build-image-qt5 -DPJ_IMAGE_TOOLS_QT_MAJOR=5 -DPJ_BUILD_IMAGE_BENCHMARKS=ON "-DPJ_IMAGE_INPUTS=$PWD/bench-inputs"
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        cmake --build build-image-qt5 --config Release --parallel 2
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        ctest --test-dir build-image-qt5 -C Release --output-on-failure --no-tests=error
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $env:QT_QPA_PLATFORM='offscreen'
        foreach ($version in 'zh3','zh4') {
          & "build-image-qt5/Release/image_bench_$version.exe" --out "bench-inputs/smoke-$version.json" --rounds 1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
    - uses: actions/upload-artifact@v4
      with:
        name: Isolated-Windows-image-benchmarks-${{ github.sha }}
        path: |
          build-image-qt5/Release/image_bench_*.exe
          bench-inputs/inputs.json
          bench-inputs/smoke-*.json
        if-no-files-found: error
