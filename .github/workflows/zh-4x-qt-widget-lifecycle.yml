# SPDX-License-Identifier: MPL-2.0
name: Validate strict actual CJK codepoint coverage
on:
  push:
    branches: ['zh-CN-4.x-ci/qt-widget-lifecycle-1459']
    paths: ['.github/workflows/zh-4x-qt-widget-lifecycle.yml']
permissions:
  contents: read
jobs:
  noto-symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 45dfdb7302e4c498fe1de47aefce4cffe685cfc6
          persist-credentials: false
      - name: Check stdlib regression and exact committed fonts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 45dfdb7302e4c498fe1de47aefce4cffe685cfc6
          test "$(git rev-parse HEAD:resources/fonts/NotoSansSymbols2/NotoSansSymbols2-Subset.ttf)" = 99f0a5e2b4b7afa3e44155a477b3d8317597efa2
          sed -n '1p' resources/fonts/NotoSansSymbols2/OFL.txt
          python3 -m venv "$RUNNER_TEMP/font-repro"
          "$RUNNER_TEMP/font-repro/bin/pip" install --disable-pip-version-check --no-deps fonttools==4.61.1
          python3 -S tests/test_cjk_font_coverage.py -v
          "$RUNNER_TEMP/font-repro/bin/python" scripts/check_cjk_font_coverage.py
          git diff --exit-code -- resources/fonts pj_app/translations
