# SPDX-License-Identifier: MPL-2.0
name: Test the branch's reproducible symbol generator
on:
  push:
    branches: ['zh-CN-4.x-ci/qt-widget-lifecycle-1459']
    paths: ['.github/workflows/zh-4x-qt-widget-lifecycle.yml']
permissions:
  contents: read
jobs:
  noto-symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 5759299277d4558f7e45afe00c40391f4a5fead4
          persist-credentials: false
      - name: Download the exact official release and reproduce the PR font
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5759299277d4558f7e45afe00c40391f4a5fead4
          test "$(git rev-parse HEAD:resources/fonts/NotoSansSymbols2/NotoSansSymbols2-Subset.ttf)" = 99f0a5e2b4b7afa3e44155a477b3d8317597efa2
          sed -n '1p' resources/fonts/NotoSansSymbols2/OFL.txt
          python3 -m venv "$RUNNER_TEMP/font-repro"
          "$RUNNER_TEMP/font-repro/bin/pip" install --disable-pip-version-check --no-deps fonttools==4.61.1
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --max-time 90 \
             'https://github.com/notofonts/symbols/releases/download/NotoSansSymbols2-v2.008/NotoSansSymbols2-v2.008.zip' \
             --output "$RUNNER_TEMP/noto-symbols-v2.008.zip"
          test "$(wc -c < "$RUNNER_TEMP/noto-symbols-v2.008.zip")" = 2331441
          python3 -S tests/test_symbol_font_regeneration.py -v
          "$RUNNER_TEMP/font-repro/bin/python" tests/test_symbol_font_regeneration.py --fonttools -v
          "$RUNNER_TEMP/font-repro/bin/python" scripts/make_cjk_font_subset.py \
            --symbols-release "$RUNNER_TEMP/noto-symbols-v2.008.zip" --check
          "$RUNNER_TEMP/font-repro/bin/python" scripts/make_cjk_font_subset.py \
            --symbols-release "$RUNNER_TEMP/noto-symbols-v2.008.zip"
          git diff --exit-code -- resources/fonts
