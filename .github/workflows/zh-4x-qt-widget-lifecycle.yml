# SPDX-License-Identifier: MPL-2.0
name: Verify exact Qt translation source offer and OFL
on:
  push:
    branches: ['zh-CN-4.x-ci/qt-widget-lifecycle-1459']
    paths: ['.github/workflows/zh-4x-qt-widget-lifecycle.yml']
permissions:
  contents: read
jobs:
  source-offer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: b48857ab87d3c70a18625df43848d766d24116e9
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
      - name: Confirm only the guard changed and run both package source suites
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b48857ab87d3c70a18625df43848d766d24116e9
          test "$(git rev-parse HEAD^)" = 5784fc667e83c064f74cd53d3e232b090d5a8fd1
          test "$(git diff --name-only HEAD^ HEAD)" = tests/wasm/wasm_source_offer.test.mjs
          node --test tests/wasm/wasm_source_offer.test.mjs tests/wasm/wasm_notices.test.mjs
      - name: Prove faulty snapshots are rejected by the intended guards
        run: |
          set -euo pipefail
          file=scripts/wasm_source_offer.mjs
          cp "$file" "$RUNNER_TEMP/original-source-offer"
          check_failed() {
            local test_name="$1" reason="$2"
            if node --test --test-name-pattern="$test_name" tests/wasm/wasm_source_offer.test.mjs >"$RUNNER_TEMP/source-negative.log" 2>&1; then
              cat "$RUNNER_TEMP/source-negative.log"
              return 1
            fi
            grep -Eq "^not ok .*$test_name" "$RUNNER_TEMP/source-negative.log"
            grep -F "$reason" "$RUNNER_TEMP/source-negative.log"
          }
          sed -i -e "/^  qttranslations: /d" "$file"
          check_failed 'the merged Chinese catalogs' 'qttranslations appears exactly once'
          cp "$RUNNER_TEMP/original-source-offer" "$file"
          sed -i 's/Object.entries(QT_MODULES).map/[...Object.entries(QT_MODULES), ["qttranslations-shadow", "duplicate"]].map/' "$file"
          check_failed 'the merged Chinese catalogs' 'qttranslations appears exactly once'
          cp "$RUNNER_TEMP/original-source-offer" "$file"
          sed -i 's/85929c0c30d6f273f23bd879bb69803ea17b010ab73cab2f8abf95357f6f6bbb/15929c0c30d6f273f23bd879bb69803ea17b010ab73cab2f8abf95357f6f6bbb/' "$file"
          check_failed 'the merged Chinese catalogs' '85929c0c30d6f273f23bd879bb69803ea17b010ab73cab2f8abf95357f6f6bbb'
          cp "$RUNNER_TEMP/original-source-offer" "$file"
          sed -i '/Noto Sans Symbols 2 (browser symbol subset)/d' cmake/PjWasmNotices.cmake
          check_failed 'the browser notices carry the Symbols 2' 'The input did not match'
          git restore -- cmake/PjWasmNotices.cmake
          git diff --exit-code
