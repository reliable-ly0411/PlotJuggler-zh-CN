# SPDX-License-Identifier: MPL-2.0
name: Validate the localized catalog patch without changing the dev branch
on:
  push:
    branches: ['zh-CN-4.x-ci/qt-widget-lifecycle-1459']
    paths: ['.github/workflows/zh-4x-qt-widget-lifecycle.yml']
permissions:
  contents: read
jobs:
  catalog-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 45dfdb7302e4c498fe1de47aefce4cffe685cfc6
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact integrated development snapshot
        run: test "$(git rev-parse HEAD)" = '45dfdb7302e4c498fe1de47aefce4cffe685cfc6'
      - name: Restore the existing pinned Qt kit if available
        uses: actions/cache/restore@v5
        with:
          path: .qt
          key: stable-delta-qt-linux-${{ hashFiles('versions.env') }}
      - name: Install and identify exact Qt, without Conan or whole app
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxcb-cursor0 libfontconfig1 libdbus-1-3
          python3 -m venv "$RUNNER_TEMP/qt-widget-tools"
          "$RUNNER_TEMP/qt-widget-tools/bin/pip" install aqtinstall==3.3.0
          export PATH="$RUNNER_TEMP/qt-widget-tools/bin:$PATH"
          source ./versions.env
          test "$PJ_QT_VERSION" = 6.12.0
          ./scripts/install_qt6.sh
          test "$(./.qt/6.12.0/gcc_64/bin/qmake -query QT_VERSION)" = 6.12.0
          test -s .qt/6.12.0/gcc_64/translations/qtbase_zh_CN.qm
          test -s .qt/6.12.0/gcc_64/translations/qtbase_zh_TW.qm
      - name: Apply only the two audited catalogs in this runner and verify real Qt
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 10e773ddbd4d543b3545feeafcb41fcda795209d
          test "$(git hash-object pj_app/translations/plotjuggler4_zh_CN.ts)" = 34fb2151d5a3fdebc94da144b1b77034e4080a2a
          test "$(git hash-object pj_app/translations/plotjuggler4_zh_TW.ts)" = 5f2afda1d7cdb2183cb19677426a3e040b472a96
          cat > "$RUNNER_TEMP/active-catalog.patch" <<'PATCH'
          diff --git a/pj_app/translations/plotjuggler4_zh_CN.ts b/pj_app/translations/plotjuggler4_zh_CN.ts
          --- a/pj_app/translations/plotjuggler4_zh_CN.ts
          +++ b/pj_app/translations/plotjuggler4_zh_CN.ts
          @@ -4659,6 +4659,22 @@
                   <source>The folder %1 is not responding, showing your home folder instead.</source>
                   <translation>文件夹 %1 无响应，改为显示您的主文件夹。</translation>
