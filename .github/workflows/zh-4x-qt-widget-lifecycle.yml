          kit="$PWD/.qt/6.12.0/gcc_64"
          lupdate="$kit/bin/lupdate"
          test "$("$lupdate" -version 2>&1)" = 'lupdate version 6.12.0'
          python3 tests/check_translations_4x.py --lupdate "$lupdate"
          python3 -m venv "$RUNNER_TEMP/catalog-proof"
          "$RUNNER_TEMP/catalog-proof/bin/pip" install --disable-pip-version-check --no-deps fonttools==4.61.1
          "$RUNNER_TEMP/catalog-proof/bin/python" scripts/check_cjk_font_coverage.py
          out="$RUNNER_TEMP/runtime-catalogs"
          mkdir -p "$out/src"
          for lang in zh_CN zh_TW; do
            "$kit/bin/lrelease" -nounfinished "pj_app/translations/plotjuggler4_$lang.ts" -qm "$out/$lang.qm"
            test -s "$out/$lang.qm"
          done
          cat > "$out/src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.22)
          project(pjCatalogRuntime LANGUAGES CXX)
          find_package(Qt6 6.12.0 EXACT REQUIRED COMPONENTS Core)
          add_executable(catalog-runtime main.cpp)
          target_link_libraries(catalog-runtime PRIVATE Qt6::Core)
          CMAKE
          cat > "$out/src/main.cpp" <<'CPP'
          #include <QCoreApplication>
          #include <QTranslator>
          struct Entry { const char *context, *source, *cn, *tw; };
          const Entry entries[] = {
            {"PJ::FileDialog", "%1 already exists. Do you want to replace it?", "%1 已存在。要替换它吗？", "%1 已存在。要取代它嗎？"},
            {"PJ::FileDialog", "Cancel", "取消", "取消"},
            {"PJ::FileDialog", "Replace", "替换", "取代"},
            {"PJ::FileDialog", "Replace file?", "替换文件？", "取代檔案？"},
            {"PJ::MainWindow", "Drop the URDF file onto a 3D view.", "将 URDF 文件拖到 3D 视图上。", "將 URDF 檔案拖到 3D 視圖上。"},
            {"PJ::PreferencesDialog", "Add a folder with robot packages", "添加包含机器人软件包的文件夹", "加入包含機器人套件的資料夾"},
            {"PJ::PreferencesDialog", "Add a folder…", "添加文件夹…", "加入資料夾…"},
            {"PreferencesContent", "Add your ROS workspace or any folder that holds robot packages: packages are found in its subfolders. The folders in $ROS_PACKAGE_PATH and $AMENT_PREFIX_PATH, and /opt/ros/<distro>/share, are searched too.", "添加 ROS 工作空间或任一包含机器人软件包的文件夹：程序会在其子文件夹中查找软件包，也会搜索 $ROS_PACKAGE_PATH、$AMENT_PREFIX_PATH 指定的文件夹及 /opt/ros/<distro>/share。", "加入 ROS 工作區或任一包含機器人套件的資料夾：程式會在其子資料夾中尋找套件，也會搜尋 $ROS_PACKAGE_PATH、$AMENT_PREFIX_PATH 指定的資料夾及 /opt/ros/<distro>/share。"},
            {"PreferencesContent", "Folders searched for robot packages (package://):", "搜索机器人软件包的文件夹（package://）：", "搜尋機器人套件的資料夾（package://）："},
            {"pj::scene3d::RobotModelLayer", "Package '%1' not found under '%2' - expected a folder named '%1'", "在“%2”下找不到软件包“%1”：应有名为“%1”的文件夹", "在「%2」下找不到套件「%1」：應有名為「%1」的資料夾"},
            {"pj::scene3d::RobotModelLayer", "Select your workspace or the folder that contains your robot packages", "选择工作空间或包含机器人软件包的文件夹", "選取工作區或包含機器人套件的資料夾"},
            {"pj::scene3d::SceneEntitiesLayer", "cannot resolve the package:// reference", "无法解析 package:// 引用", "無法解析 package:// 參照"},
            {"pj::scene3d::SceneEntitiesLayer", "package '%1' not found in the mesh search folders", "在网格搜索文件夹中找不到软件包“%1”", "在網格搜尋資料夾中找不到套件「%1」"},
            {"pj::scene3d::SceneViewWidget", "Software rendering (%1): reduced 3D quality", "软件渲染（%1）：3D 画质已降低", "軟體算繪（%1）：3D 畫質已降低"},
          };
          int main(int argc, char **argv) {
            QCoreApplication app(argc, argv);
            if (argc != 3) return 1;
            for (int i = 1; i <= 2; ++i) {
              QTranslator translator;
              if (!translator.load(QString::fromLocal8Bit(argv[i]))) return 2;
              for (const auto &entry : entries) {
                const auto expected = QString::fromUtf8(i == 1 ? entry.cn : entry.tw);
                if (translator.translate(entry.context, entry.source) != expected)
                  qFatal("Catalog runtime mismatch: %s / %s", entry.context, entry.source);
              }
              if (!translator.translate("PreferencesContent", "Folders containing 3D assets").isEmpty())
                qFatal("Vanished catalog entry is still active");
              qInfo("Actual QTranslator: %s all 14 new keys load (old key absent)", argv[i]);
            }
            return 0;
          }
