# SPDX-License-Identifier: MPL-2.0
name: Reproduce the PlotJuggler Noto Symbols subset
on:
  push:
    branches: ['zh-CN-4.x-ci/qt-widget-lifecycle-1459']
    paths: ['.github/workflows/zh-4x-qt-widget-lifecycle.yml']
permissions:
  contents: read
jobs:
  noto-symbols:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 50003de47c6629e2544f7ad8784e9cdce049738e
          persist-credentials: false
      - name: Download the exact official release and reproduce the PR font
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 50003de47c6629e2544f7ad8784e9cdce049738e
          test "$(git rev-parse HEAD:resources/fonts/NotoSansSymbols2/NotoSansSymbols2-Subset.ttf)" = 99f0a5e2b4b7afa3e44155a477b3d8317597efa2
          sed -n '1p' resources/fonts/NotoSansSymbols2/OFL.txt
          python3 -m venv "$RUNNER_TEMP/font-repro"
          "$RUNNER_TEMP/font-repro/bin/pip" install --disable-pip-version-check --no-deps fonttools==4.61.1
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location --max-time 90 \
             'https://github.com/notofonts/symbols/releases/download/NotoSansSymbols2-v2.008/NotoSansSymbols2-v2.008.zip' \
             --output "$RUNNER_TEMP/noto-symbols-v2.008.zip"
          "$RUNNER_TEMP/font-repro/bin/python" - "$RUNNER_TEMP/noto-symbols-v2.008.zip" <<'PY'
          import datetime
          import hashlib
          import io
          import json
          from pathlib import Path, PurePosixPath
          import sys
          from zipfile import ZipFile
          import fontTools
          from fontTools import subset
          from fontTools.ttLib import TTFont

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          ref = Path("resources/fonts/NotoSansSymbols2/NotoSansSymbols2-Subset.ttf").read_bytes()
          assert (len(ref), sha(ref)) == (6024, "af2c02d3aea7811b6096164cf83fb58a97182aeb71d3540070f154f79b7ea8b1")
          release = Path(sys.argv[1]).read_bytes()
          assert len(release) == 2331441, len(release)
          print(f"Official release ZIP {len(release)} B SHA256 {sha(release)}")
          with ZipFile(io.BytesIO(release)) as z:
              members = [n for n in z.namelist() if PurePosixPath(n).name == "NotoSansSymbols2-Regular.ttf"]
              print(f"Official Regular TTF members: {members}")
              donors = []
              for member in members:
                  data = z.read(member)
                  f = TTFont(io.BytesIO(data))
                  version = f["name"].getDebugName(5)
                  family = f["name"].getDebugName(1)
                  modified = datetime.datetime.fromtimestamp(f["head"].modified - 2082844800, datetime.timezone.utc).isoformat()
                  print(f"Member {member}: {len(data)} B SHA256 {sha(data)} {family!r} {version!r} modified={modified}")
                  if family == "Noto Sans Symbols 2" and version == "Version 2.008; ttfautohint (v1.8.4.7-5d5b)" and modified == "2023-10-13T11:05:37+00:00" and all(t in f for t in ("fpgm", "prep", "cvt ")):
                      donors.append((member, data))
          assert len(donors) == 1, [member for member, _ in donors]
          member, donor = donors[0]
          opt = subset.Options()
          opt.layout_features = ["*"]
          opt.name_IDs = ["*"]
          opt.notdef_outline = True
          opt.ignore_missing_unicodes = False
          f = subset.load_font(io.BytesIO(donor), opt)
          work = subset.Subsetter(opt)
          work.populate(unicodes=[0x25B8])
          work.subset(f)
          out = io.BytesIO()
          subset.save_font(f, out, opt)
          result = out.getvalue()
          expected = TTFont(io.BytesIO(ref))
          actual = TTFont(io.BytesIO(result))
          assert actual.getBestCmap() == expected.getBestCmap() == {0x25B8: "uni25B8"}
          tables = set(expected.reader.keys()) | set(actual.reader.keys())
          differs = sorted(t for t in tables if t not in expected.reader or t not in actual.reader or expected.reader[t] != actual.reader[t])
          print(json.dumps(dict(fonttools=fontTools.version, donor=member, donor_sha256=sha(donor), result_bytes=len(result),
                                result_sha256=sha(result), byte_identical=result == ref, differing_tables=differs)))
          assert result == ref, "Only original-donor byte-identical reproduction passes this job"
          PY
