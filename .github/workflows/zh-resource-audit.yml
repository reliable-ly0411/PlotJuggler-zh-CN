name: Resource and released package audit
'on':
  push:
    branches: [zh4/resource-overlays]
    paths:
      - .github/workflows/zh-resource-audit.yml
      - scripts/audit_release_packages.py
      - scripts/resource_size_audit.py
      - tests/data/release-size-baseline.json
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Install read-only inspection tools
      run: sudo apt-get update && sudo apt-get install -y squashfs-tools qtbase5-dev-tools
    - name: Fetch immutable resource references
      run: git fetch --no-tags --depth=1 https://github.com/reliable-ly0411/PlotJuggler-zh-CN.git de2821269e4fa138ff88dd5e856b111cc4942ee9 3117288ce8d710bde4f7a86ca5ed5240ebb1c301
    - name: Measure Qt5 RCC and inspect baseline packages
      run: |
        python3 scripts/resource_size_audit.py --out audit/qt5-rcc.json
        python3 scripts/audit_release_packages.py --manifest tests/data/release-size-baseline.json --out audit/released-packages.json
    - uses: actions/upload-artifact@v4
      with:
        name: resource-size-baseline-audit
        path: audit/
        if-no-files-found: error
