# SPDX-License-Identifier: MPL-2.0
name: Exact localized production and retained acceptance check
on:
  push:
    branches: ['zh-CN-4.x-ci/dev-symbol-python-production-20261123']
    paths: ['.github/workflows/zh-4x-dev-symbol-python-production-20261123.yml']
permissions:
  contents: read
env:
  PJ_VALIDATION_ROLE: localized
  PJ_SOURCE_REPOSITORY: reliable-ly0411/PlotJuggler-zh-CN
  PJ_SOURCE_SHA: 90c136cea1d8ac27b557d83e979d1894f9a5890c
  PJ_CONTROLLER_SHA: 90c136cea1d8ac27b557d83e979d1894f9a5890c
  PJ_WASM_URL: http://127.0.0.1:6931/
jobs:
  production:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Use HTTPS for recursive sources
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v6
        with:
          ref: 90c136cea1d8ac27b557d83e979d1894f9a5890c
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 90c136cea1d8ac27b557d83e979d1894f9a5890c
          path: .ci-controller
          persist-credentials: false
      - name: Verify exact product and original 26 MB gate
        run: |
          test "$(git rev-parse HEAD)" = "$PJ_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = 4f72195d15343fafa6f08bb8bb6e3869a3eb61f8
          grep -Fx 'const budget = 26000000;' scripts/wasm_localized_size_budget.mjs
      - name: Read toolchain versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          for name in PJ_QT_VERSION PJ_EMSCRIPTEN_VERSION PJ_WASM_NODE_VERSION; do
            echo "${name}=${!name}" >> "${GITHUB_ENV}"
          done
          echo "wasm_qt=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "emscripten=${PJ_EMSCRIPTEN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "node=${PJ_WASM_NODE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned packaging runtime
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.node }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build python3-pip make pkg-config
          # Scene2D video cross-compiles dav1d, whose build system is meson.
          python3 -m pip install --user meson
          # Runtime libraries for the desktop host Qt tools (qsb bakes the QRhi
          # shaders offline and transitively links the full Qt GUI stack, even
          # headless). The lean runner ships none of these, so qsb would die at
          # load time with exit 127.
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libfontconfig1 libfreetype6 libxkbcommon0 \
            libx11-6 libxcb1 libglib2.0-0 libdbus-1-3

      - name: Cache Qt WebAssembly and host kits
        id: qt-cache
        uses: actions/cache/restore@v5
        with:
          path: .qt-wasm
          key: qt-wasm-${{ steps.versions.outputs.wasm_qt }}-multithread-shadertools-v1

      - name: Install Qt WebAssembly and host kits
        if: steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'aqtinstall==3.3.0'
          "${HOME}/.local/bin/aqt" install-qt linux desktop \
            "${PJ_QT_VERSION}" linux_gcc_64 --outputdir .qt-wasm \
            -m qtshadertools
          "${HOME}/.local/bin/aqt" install-qt all_os wasm \
            "${PJ_QT_VERSION}" wasm_multithread --outputdir .qt-wasm \
            -m qtshadertools

      - name: Cache Emscripten SDK
        id: emsdk-cache
        uses: actions/cache/restore@v5
        with:
          path: .emsdk
          key: emsdk-${{ steps.versions.outputs.emscripten }}-linux-x64-v1

      - name: Install Emscripten SDK
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${PJ_EMSCRIPTEN_VERSION}" \
            https://github.com/emscripten-core/emsdk.git .emsdk
          .emsdk/emsdk install "${PJ_EMSCRIPTEN_VERSION}"
          .emsdk/emsdk activate "${PJ_EMSCRIPTEN_VERSION}"

      - name: Restore WebAssembly compiler cache
        # restore/save split rather than actions/cache: the implicit post-job
        # save fires on every run and the SHA-keyed entry is never an exact
        # hit, so each run persisted a new blob of up to max_size (4 G below)
        # into billed Depot Cache storage. See linux-ci.yml's "Save ccache".
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-zh4-localized-90c136cea1d8ac27b557d83e979d1894f9a5890c
          restore-keys: |
            ccache-zh4-localized-

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache --zero-stats

      - name: Cache the WebAssembly CPython build
        # A content key (the recipe with its pinned tarball hash, the Emscripten
        # release): an exact hit or a cold ~4 minute build, so the plain action,
        # which saves only on a miss, adds one entry per recipe change.
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/pj-wasm-cpython
          key: wasm-cpython-${{ hashFiles('cmake/PjWasmPython.cmake', 'cmake/wasm_python/**') }}-emsdk-${{ steps.versions.outputs.emscripten }}
      - name: Build production package (shipped defaults, probes off)
        shell: bash
        run: |
          set -euo pipefail
          source .emsdk/emsdk_env.sh >/dev/null
          # Scene2D's find_package(ZLIB 1.3.1 EXACT) resolves against Emscripten's
          # lazily materialized sysroot zlib port; build it before configuring.
          embuilder build zlib
          cmake -S . -B build-wasm-prod -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${PWD}/.qt-wasm/${PJ_QT_VERSION}/wasm_multithread/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${PWD}/.qt-wasm/${PJ_QT_VERSION}/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPJ_BUILD_TESTS=OFF \
            -DPJ_BUILD_DEMOS=OFF \
            -DPJ_WASM_ENABLE_INGRESS_PROBE=OFF \
            -DPJ_WASM_PYTHON_CACHE_DIR="${HOME}/.cache/pj-wasm-cpython"
          cmake --build build-wasm-prod --target pj_app --parallel 2

      - name: Package production build and verify packaging scripts
        shell: bash
        run: |
          set -euo pipefail
          # Language probe unit tests import the pinned Playwright assertions.
          npm --prefix tests/wasm ci
          npm --prefix tests/wasm run test:package
          node scripts/package_wasm.mjs --presets resources/wasm-presets \
            --source build-wasm-prod/pj_app --output build-wasm-prod/deploy
          node scripts/package_wasm.mjs --presets resources/wasm-presets \
            --source build-wasm-prod/pj_app --output build-wasm-prod/deploy-b
          diff -qr build-wasm-prod/deploy build-wasm-prod/deploy-b

      - name: Record production identity and actual sizes
        run: |
          python3 .ci-controller/packaging/localization/wasm_receipt.py capture \
            --role "$PJ_VALIDATION_ROLE" --source-repository "$PJ_SOURCE_REPOSITORY" \
            --source-sha "$PJ_SOURCE_SHA" --controller-sha "$PJ_CONTROLLER_SHA" --kind production \
            --cache build-wasm-prod/CMakeCache.txt --package build-wasm-prod/deploy \
            --output validation-receipts/production.json

      - name: Preserve exact production package
        uses: actions/upload-artifact@v4
        with:
          name: wasm-localized-production-90c136cea1d8ac27b557d83e979d1894f9a5890c-${{ github.run_attempt }}
          path: |
            build-wasm-prod/deploy
            validation-receipts/production.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Complete localized total budget
        run: node scripts/wasm_localized_size_budget.mjs build-wasm-prod/deploy/manifest.json

      - name: Cache Playwright browsers
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('tests/wasm/package-lock.json') }}

      - name: Install browser gate
        working-directory: tests/wasm
        run: npx playwright install --with-deps chromium

      - name: Deployment contract and cold threaded boot (production package)
        working-directory: tests/wasm
        env:
          PJ_WASM_PACKAGE_DIR: ${{ github.workspace }}/build-wasm-prod/deploy
        run: npm run test:deployment

  retained-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 90c136cea1d8ac27b557d83e979d1894f9a5890c
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 90c136cea1d8ac27b557d83e979d1894f9a5890c
          path: .ci-controller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .replay-controller
          sparse-checkout: .github/wasm-js-replay
          persist-credentials: false
      - name: Download exact successful acceptance artifact without recompilation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PJ_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = 4f72195d15343fafa6f08bb8bb6e3869a3eb61f8
          test "$(gh api repos/$PJ_SOURCE_REPOSITORY/actions/artifacts/14808100888 --jq .workflow_run.id)" = 45143373887
          zip="$RUNNER_TEMP/accepted-tu.zip"
          gh api "repos/$PJ_SOURCE_REPOSITORY/actions/artifacts/14808100888/zip" > "$zip"
          echo "390c8b6807773c30d03fb6daaec4cf5de8ba4aedd86c40e83cd15d851c7cb6bd  $zip" | sha256sum -c -
          unzip -q "$zip" 'build-wasm-probe/deploy/*' validation-receipts/acceptance.json
          python3 .ci-controller/packaging/localization/wasm_receipt.py verify \
            --role localized --source-repository "$PJ_SOURCE_REPOSITORY" --source-sha "$PJ_SOURCE_SHA" \
            --controller-sha "$PJ_CONTROLLER_SHA" --kind acceptance --package build-wasm-probe/deploy \
            --output validation-receipts/acceptance.json
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
      - name: Install browser and stage reviewed JS-only assertions
        run: |
          set -euo pipefail
          for name in log_widget_targeted.spec.js scene2d.spec.js; do
            cp ".replay-controller/.github/wasm-js-replay/$name" "tests/wasm/$name"
            node --check "tests/wasm/$name"
          done
          cd tests/wasm
          npm ci
          npx playwright install --with-deps chromium
      - name: Serve exact acceptance on loopback
        run: |
          mkdir -p replay-evidence
          node scripts/serve_wasm.mjs --root build-wasm-probe/deploy --host 127.0.0.1 --port 6931 >replay-evidence/server.log 2>&1 &
          for _ in $(seq 1 50); do curl -fsS -o /dev/null "$PJ_WASM_URL" && break; sleep .2; done
          curl -fsS -o /dev/null "$PJ_WASM_URL"
      - name: Localized real log binding, layout, glyph-catalog, JPEG and compositor checks
        working-directory: tests/wasm
        run: |
          set -o pipefail
          status=0
          npx playwright test --config log_widget.playwright.config.js --output ../../replay-evidence/log 2>&1 | tee ../../replay-evidence/log.txt || status=1
          npx playwright test --config jpeg_visual.playwright.config.js --output ../../replay-evidence/jpeg 2>&1 | tee ../../replay-evidence/jpeg.txt || status=1
          PJ_WASM_TEST_LANGUAGE=en_US npx playwright test scene2d.spec.js --project=chromium --workers=1 \
            --grep 'Foxglove JPEG, annotations, split Scene2D docks, and recreation render' \
            --output ../../replay-evidence/scene2d 2>&1 | tee ../../replay-evidence/scene2d.txt || status=1
          exit "$status"
      - name: Retain targeted browser evidence and original acceptance receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-sandbox-tu-localized-regressions-${{ github.run_attempt }}
          path: |
            replay-evidence/
            validation-receipts/acceptance.json
