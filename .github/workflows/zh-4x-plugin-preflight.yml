name: Chinese rc.2 Windows plugin preflight
on:
  push:
    branches: ['zh-CN-4.x-ci/plugin-preflight-rc2-final5']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zh-4x-plugin-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plugins:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created && github.ref_name == 'zh-CN-4.x-ci/plugin-preflight-rc2-final5')
    runs-on: windows-2022
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      PJ_DISABLE_TELEMETRY: '1'
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Cheap guards before dependencies
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s .github/release_policy -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/check_translations_4x.py --catalog-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/check_windows_packaging.ps1
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Native plugin tools
        run: python -m pip install 'conan>=2,<3' 'cmake>=3.28,<4' 'ninja!=1.13.0'
      - uses: actions/cache/restore@v5
        with:
          path: ~/.conan2
          key: zh4-plugins-windows-${{ hashFiles('packaging/localization/plugin-patches/source-lock.json') }}
          restore-keys: |
            zh4-plugins-windows-
      - name: Public dependency configuration
        shell: bash
        run: |
          conan profile detect --force
          ./scripts/configure_conan_remote.sh
      - name: Actual isolated plugin builds, MSVC flags, identities and offline tests
        run: python packaging/localization/build_localized_plugins.py --work build/localized-plugins --prefix build/preflight-prefix --preflight
      - name: Preserve plugin-only proof, not release assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-plugin-preflight-proof
          path: |
            build/localized-plugins/completed.json
            build/localized-plugins/*/build/conan-graph.json
            build/localized-plugins/*/build/conan.lock
            build/localized-plugins/*/build/offline-tests.xml
            build/localized-plugins/*/build/native-compile-commands.txt
            build/localized-plugins/*/build/native/Testing/Temporary/
            build/preflight-prefix/share/
          if-no-files-found: warn
