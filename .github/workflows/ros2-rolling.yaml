name: ros2-rolling
true:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Cache apt packages
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: software-properties-common python3 python3-dev qtbase5-dev libqt5svg5-dev libqt5websockets5-dev libqt5opengl5-dev
          libqt5x11extras5-dev libprotoc-dev libzmq3-dev liblz4-dev libzstd-dev libmosquitto-dev
        version: 1.0
    - uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: rolling
    - name: Fix Python path for ROS packages
      run: echo "PYTHONPATH=/usr/lib/python3/dist-packages:$PYTHONPATH" >> $GITHUB_ENV
    - name: Install missing rolling typesupport
      run: sudo apt-get install -y ros-rolling-rosidl-typesupport-introspection-c ros-rolling-rosidl-typesupport-introspection-cpp
    - uses: ros-tooling/action-ros-ci@v0.4
      with:
        package-name: plotjuggler
        target-ros2-distro: rolling
    if: github.repository == 'PlotJuggler/PlotJuggler' && (true)
