name: 4.x stable delta Windows source-native checks
on:
  push:
    branches: [zh-CN-4.x-ci/stable-delta-windows-20261113]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-targeted:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      PJ_BUILD_JOBS: '2'
      PYTHONIOENCODING: utf-8
      QT_QPA_PLATFORM: windows
      QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
      PJ_REQUIRE_GPU_TESTS: '1'
      QT_LOGGING_RULES: pj.graphics.info=true
      QT_FORCE_STDERR_LOGGING: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare evidence and official source-build tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $e=Join-Path $env:RUNNER_TEMP 'stable-delta-windows-evidence'
          New-Item -ItemType Directory -Path $e | Out-Null
          git rev-parse HEAD | Out-File "$e/commit.txt"
          git submodule status --recursive | Out-File "$e/submodules.txt"
          python -m pip install conan==2.22.2 cmake==3.31.10 ninja
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./scripts/windows/install_qt6.ps1 2>&1 | Tee-Object "$e/qt.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build application and necessary native test targets from source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $e=Join-Path $env:RUNNER_TEMP 'stable-delta-windows-evidence'
          # The normal source builder retains locked sources and provenance.
          # No old native-kit is loaded or silently re-approved.
          & ./scripts/windows/build.ps1 --no-demos --no-widget-demos --no-marketplace-app --target pj_app 2>&1 | Tee-Object "$e/app-build.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($target in @('pj_app_unit_tests','pj_app_gui_tests','pj_plotting_widget_tests','rhi_mixed_dock_test','scene3d_rhi_model_cache_test')) {
            & ./scripts/windows/build.ps1 --skip-conan-install --no-demos --no-widget-demos --no-marketplace-app --target $target 2>&1 | Tee-Object -Append "$e/test-build.log"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          $qt=(Get-Content versions.env | Where-Object { $_ -match '^PJ_QT_VERSION=' }) -replace '^PJ_QT_VERSION=',''
          "$env:GITHUB_WORKSPACE/.qt/$qt/msvc2022_64/bin" >> $env:GITHUB_PATH
          foreach ($file in @('build/pj_ffmpeg_bin_dirs.txt','build/pj_python_bin_dirs.txt')) {
            if (Test-Path $file) { Get-Content $file | Where-Object { $_ } | Add-Content $env:GITHUB_PATH }
          }
      - name: Run explicit changed-surface tests without accepting skips
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $e=Join-Path $env:RUNNER_TEMP 'stable-delta-windows-evidence'
          python scripts/validation/select_stable_delta_tests.py build $e
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build -C RelWithDebInfo --tests-from-file "$e/test-names.txt" --output-on-failure --timeout 120 --parallel 1 --no-tests=error --output-junit "$e/ctest.xml" 2>&1 | Tee-Object "$e/ctest.log"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import sys,xml.etree.ElementTree as E;c=E.parse(sys.argv[1]).getroot().findall('.//testcase');assert c;assert all(not any(x.find(k) is not None for k in ('failure','error','skipped')) for x in c), 'Failed or skipped tests';print('Targeted passed:',len(c))" "$e/ctest.xml"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: stable-delta-windows-evidence
          path: ${{ runner.temp }}/stable-delta-windows-evidence
          if-no-files-found: error
