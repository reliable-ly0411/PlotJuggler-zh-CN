# SPDX-License-Identifier: MPL-2.0
# Independent complete builds: frozen reference, matched upstream and localized product.
name: Chinese 4.x WASM candidate
on:
  push:
    branches: ['zh-CN-4.x-ci/upstream-fae51d5b-integration']
  workflow_dispatch:
    inputs:
      artifact_only:
        description: Replay the pinned #71 acceptance artifact without rebuilding
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: zh4-wasm-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.artifact_only) ||
      (github.event_name == 'push' && github.event.head_commit.message != 'Replay verified #71 WASM acceptance artifact only')
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.identity.outputs.upstream_sha }}
      comparator_sha: ${{ steps.identity.outputs.comparator_sha }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        run: |
          python3 - <<'PY_IDENTITY'
          import json, os, re, subprocess
          root = 'docs/localization/'
          baseline = json.load(open(root + 'upstream-baseline.json', encoding='utf-8'))
          targets = json.load(open(root + 'wasm-validation-targets.json', encoding='utf-8'))
          assert baseline['upstream_repository'] == 'https://github.com/PlotJuggler/PlotJuggler'
          assert baseline['upstream_commit'] == targets['upstream']['sha']
          assert targets['upstream']['repository'] == targets['upstream-comparator']['repository'] == 'PlotJuggler/PlotJuggler'
          assert targets['localized']['repository'] == os.environ['GITHUB_REPOSITORY'] == 'reliable-ly0411/PlotJuggler-zh-CN'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          source = targets['localized']['sha']
          for record in targets.values():
              sha = record['sha']
              assert re.fullmatch('[0-9a-f]{40}', sha)
              assert git('rev-parse', f'{sha}^{{tree}}') == record['tree']
              git('merge-base', '--is-ancestor', sha, source)
          git('merge-base', '--is-ancestor', source, head)
          assert targets['upstream']['sha'] != targets['upstream-comparator']['sha']
          allowed = {
              '.github/workflows/zh-4x-wasm-candidate.yml',
              '.github/workflows/zh-4x-wasm-lane.yml',
              'docs/localization/wasm-validation-targets.json',
              'packaging/localization/wasm_receipt.py',
              'tests/test_wasm_validation_receipt.py',
          }
          delta = set(git('diff', '--name-only', source, head).splitlines())
          assert delta <= allowed, sorted(delta - allowed)
          for version_key in ('PJ_QT_VERSION', 'PJ_EMSCRIPTEN_VERSION', 'PJ_WASM_NODE_VERSION'):
              pins = {
                  next(line for line in git('show', record['sha'] + ':versions.env').splitlines()
                       if line.startswith(version_key + '='))
                  for record in targets.values()
              }
              assert len(pins) == 1, pins
          upstream_workflow = git('show', targets['upstream-comparator']['sha'] + ':.github/workflows/wasm-ci.yml')
          assert 'scripts/wasm_size_budget.mjs build-wasm-prod/deploy/manifest.json 20000000' in upstream_workflow
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"upstream_sha={targets['upstream']['sha']}\n")
              output.write(f"comparator_sha={targets['upstream-comparator']['sha']}\n")
              output.write(f"candidate_sha={targets['localized']['sha']}\n")
          PY_IDENTITY
  upstream:
    needs: identity
    uses: ./.github/workflows/zh-4x-wasm-lane.yml
    with:
      role: upstream
      source_repository: PlotJuggler/PlotJuggler
      source_sha: ${{ needs.identity.outputs.upstream_sha }}
      acceptance_symbol_map: true
  matched_upstream:
    needs: identity
    uses: ./.github/workflows/zh-4x-wasm-lane.yml
    with:
      role: upstream-comparator
      source_repository: PlotJuggler/PlotJuggler
      source_sha: ${{ needs.identity.outputs.comparator_sha }}
      acceptance_symbol_map: true
  localized:
    needs: identity
    uses: ./.github/workflows/zh-4x-wasm-lane.yml
    with:
      role: localized
      source_repository: ${{ github.repository }}
      source_sha: ${{ needs.identity.outputs.candidate_sha }}
      acceptance_symbol_map: true
  replay:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.artifact_only) ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Replay verified #71 WASM acceptance artifact only')
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    env:
      PJ_WASM_URL: http://127.0.0.1:6931/
      PJ_WASM_BUILD_DIR: build-wasm-probe
      PJ_WASM_PYTHON: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 857bd12b935579458914de18b59d8950b8bf71bd
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 4c1ddc674097a5ab7391368050303208f99a6c72
          path: .ci-controller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .replay-controller
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ci/pj71-wasm-replay/
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
      - name: Download pinned artifact and verify original acceptance receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/replay.sh verify
      - name: Provision pinned browser and vendored mirror inputs
        env:
          REPLAY_BROWSER: ${{ matrix.browser }}
        run: |
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgl1-mesa-dri libegl-mesa0
          npm --prefix tests/wasm ci
          (cd tests/wasm; npx playwright install --with-deps "$REPLAY_BROWSER")
      - uses: actions/cache/restore@v5
        with:
          path: build-wasm-assets
          key: wasm-hosted-assets-${{ hashFiles('tests/wasm/fixtures/hosted_assets.json') }}
      - run: npm --prefix tests/wasm run fetch:assets
      - name: Replay exact Log and serial rollback cases
        env:
          REPLAY_BROWSER: ${{ matrix.browser }}
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/replay.sh test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pj71-wasm-artifact-replay-${{ matrix.browser }}-${{ github.run_attempt }}
          path: replay-evidence/
