# SPDX-License-Identifier: MPL-2.0
# Independent complete builds: frozen reference, matched upstream and localized product.
name: Chinese 4.x WASM candidate
on:
  push:
    branches: ['zh-CN-4.x-ci/upstream-fae51d5b-integration']
  workflow_dispatch:
    inputs:
      artifact_only:
        description: Replay the pinned #71 acceptance artifact without rebuilding
        type: boolean
        default: false
      artifact_luau:
        description: Replay only the Firefox Luau acceptance case on the pinned artifact
        type: boolean
        default: false
      profile_failed_luau:
        description: Run the separate diagnostic profile only after a failing Luau acceptance case
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: zh4-wasm-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  identity:
    if: >-
      (github.event_name == 'workflow_dispatch' && !inputs.artifact_only && !inputs.artifact_luau) ||
      (github.event_name == 'push' && github.event.head_commit.message != 'Replay verified #71 WASM acceptance artifact only' &&
       github.event.head_commit.message != 'Probe verified #71 Firefox Luau heartbeat only' &&
       github.event.head_commit.message != 'Compare pinned Firefox Luau baseline with startup-safe shared parsed panel candidate' &&
       github.event.head_commit.message != 'Profile verified Firefox Luau candidate D artifact only' &&
       github.event.head_commit.message != 'Compare pinned Firefox Luau candidate D with selected-view candidate E')
    runs-on: ubuntu-22.04
    outputs:
      upstream_sha: ${{ steps.identity.outputs.upstream_sha }}
      comparator_sha: ${{ steps.identity.outputs.comparator_sha }}
      candidate_sha: ${{ steps.identity.outputs.candidate_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        run: |
          python3 - <<'PY_IDENTITY'
          import json, os, re, subprocess
          root = 'docs/localization/'
          baseline = json.load(open(root + 'upstream-baseline.json', encoding='utf-8'))
          targets = json.load(open(root + 'wasm-validation-targets.json', encoding='utf-8'))
          assert baseline['upstream_repository'] == 'https://github.com/PlotJuggler/PlotJuggler'
          assert baseline['upstream_commit'] == targets['upstream']['sha']
          assert targets['upstream']['repository'] == targets['upstream-comparator']['repository'] == 'PlotJuggler/PlotJuggler'
          assert targets['localized']['repository'] == os.environ['GITHUB_REPOSITORY'] == 'reliable-ly0411/PlotJuggler-zh-CN'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          head = git('rev-parse', 'HEAD')
          assert head == os.environ['GITHUB_SHA']
          source = targets['localized']['sha']
          for record in targets.values():
              sha = record['sha']
              assert re.fullmatch('[0-9a-f]{40}', sha)
              assert git('rev-parse', f'{sha}^{{tree}}') == record['tree']
              git('merge-base', '--is-ancestor', sha, source)
          git('merge-base', '--is-ancestor', source, head)
          assert targets['upstream']['sha'] != targets['upstream-comparator']['sha']
          allowed = {
              '.github/workflows/zh-4x-wasm-candidate.yml',
              '.github/workflows/zh-4x-wasm-lane.yml',
              'docs/localization/wasm-validation-targets.json',
              'packaging/localization/wasm_receipt.py',
              'tests/test_wasm_validation_receipt.py',
          }
          delta = set(git('diff', '--name-only', source, head).splitlines())
          assert delta <= allowed, sorted(delta - allowed)
          for version_key in ('PJ_QT_VERSION', 'PJ_EMSCRIPTEN_VERSION', 'PJ_WASM_NODE_VERSION'):
              pins = {
                  next(line for line in git('show', record['sha'] + ':versions.env').splitlines()
                       if line.startswith(version_key + '='))
                  for record in targets.values()
              }
              assert len(pins) == 1, pins
          upstream_workflow = git('show', targets['upstream-comparator']['sha'] + ':.github/workflows/wasm-ci.yml')
          assert 'scripts/wasm_size_budget.mjs build-wasm-prod/deploy/manifest.json 20000000' in upstream_workflow
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"upstream_sha={targets['upstream']['sha']}\n")
              output.write(f"comparator_sha={targets['upstream-comparator']['sha']}\n")
              output.write(f"candidate_sha={targets['localized']['sha']}\n")
          PY_IDENTITY
  upstream:
    needs: identity
    uses: ./.github/workflows/zh-4x-wasm-lane.yml
    with:
      role: upstream
      source_repository: PlotJuggler/PlotJuggler
      source_sha: ${{ needs.identity.outputs.upstream_sha }}
      acceptance_symbol_map: true
  matched_upstream:
    needs: identity
    uses: ./.github/workflows/zh-4x-wasm-lane.yml
    with:
      role: upstream-comparator
      source_repository: PlotJuggler/PlotJuggler
      source_sha: ${{ needs.identity.outputs.comparator_sha }}
      acceptance_symbol_map: true
  localized:
    needs: identity
    uses: ./.github/workflows/zh-4x-wasm-lane.yml
    with:
      role: localized
      source_repository: ${{ github.repository }}
      source_sha: ${{ needs.identity.outputs.candidate_sha }}
      acceptance_symbol_map: true
  replay:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.artifact_only || inputs.artifact_luau)) ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Replay verified #71 WASM acceptance artifact only') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Probe verified #71 Firefox Luau heartbeat only') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Compare pinned Firefox Luau baseline with startup-safe shared parsed panel candidate') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Profile verified Firefox Luau candidate D artifact only') ||
      (github.event_name == 'push' && github.event.head_commit.message == 'Compare pinned Firefox Luau candidate D with selected-view candidate E')
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: >-
          ${{ fromJSON((inputs.artifact_luau || github.event.head_commit.message == 'Probe verified #71 Firefox Luau heartbeat only' || github.event.head_commit.message == 'Compare pinned Firefox Luau baseline with startup-safe shared parsed panel candidate' || github.event.head_commit.message == 'Profile verified Firefox Luau candidate D artifact only' || github.event.head_commit.message == 'Compare pinned Firefox Luau candidate D with selected-view candidate E') && '["firefox"]' || '["chromium","firefox"]') }}
    env:
      PJ_WASM_URL: http://127.0.0.1:6931/
      PJ_WASM_BUILD_DIR: build-wasm-probe
      PJ_WASM_PYTHON: '1'
      REPLAY_LUAU_ONLY: >-
        ${{ (inputs.artifact_luau || github.event.head_commit.message == 'Probe verified #71 Firefox Luau heartbeat only' || github.event.head_commit.message == 'Compare pinned Firefox Luau baseline with startup-safe shared parsed panel candidate' || github.event.head_commit.message == 'Profile verified Firefox Luau candidate D artifact only' || github.event.head_commit.message == 'Compare pinned Firefox Luau candidate D with selected-view candidate E') }}
      COMPARE_LUAU_ONLY: >-
        ${{ github.event_name == 'push' && github.event.head_commit.message == 'Compare pinned Firefox Luau baseline with startup-safe shared parsed panel candidate' }}
      COMPARE_E_ONLY: >-
        ${{ github.event_name == 'push' && github.event.head_commit.message == 'Compare pinned Firefox Luau candidate D with selected-view candidate E' }}
      PROFILE_D_ONLY: >-
        ${{ github.event_name == 'push' && github.event.head_commit.message == 'Profile verified Firefox Luau candidate D artifact only' }}
      PROFILE_FAILED_LUAU: ${{ github.event_name == 'push' || inputs.profile_failed_luau }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 857bd12b935579458914de18b59d8950b8bf71bd
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 4c1ddc674097a5ab7391368050303208f99a6c72
          path: .ci-controller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: .replay-controller
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ci/pj71-wasm-replay/
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.22.1'
      - name: Download pinned artifact and verify original acceptance receipt
        if: env.PROFILE_D_ONLY != 'true' && env.COMPARE_E_ONLY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/replay.sh verify
      - name: Verify and stage the exact candidate D artifacts (no build)
        if: env.PROFILE_D_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/d-replay.sh
      - name: Provision pinned browser and vendored mirror inputs
        env:
          REPLAY_BROWSER: ${{ matrix.browser }}
        run: |
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libgl1-mesa-dri libegl-mesa0
          npm --prefix tests/wasm ci
          (cd tests/wasm; npx playwright install --with-deps "$REPLAY_BROWSER")
      - uses: actions/cache/restore@v5
        if: env.REPLAY_LUAU_ONLY != 'true'
        with:
          path: build-wasm-assets
          key: wasm-hosted-assets-${{ hashFiles('tests/wasm/fixtures/hosted_assets.json') }}
      - run: npm --prefix tests/wasm run fetch:assets
        if: env.REPLAY_LUAU_ONLY != 'true'
      - name: Replay exact Log and serial rollback cases
        if: env.REPLAY_LUAU_ONLY != 'true'
        env:
          REPLAY_BROWSER: ${{ matrix.browser }}
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/replay.sh test
      - name: Replay sole Firefox Luau acceptance case and retain independent diagnostic
        if: env.REPLAY_LUAU_ONLY == 'true' && env.COMPARE_LUAU_ONLY != 'true' && env.COMPARE_E_ONLY != 'true'
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/luau.sh
      - name: Materialize and verify distinct startup-safe shared-parsed-panel product D
        if: env.COMPARE_LUAU_ONLY == 'true'
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/ab.sh materialize

      - name: Prepare exact E source after verified D baseline
        if: env.COMPARE_E_ONLY == 'true'
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/de.sh materialize

      - name: Read toolchain versions
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          source ./versions.env
          for name in PJ_QT_VERSION PJ_EMSCRIPTEN_VERSION PJ_WASM_NODE_VERSION; do
            echo "${name}=${!name}" >> "${GITHUB_ENV}"
          done
          echo "wasm_qt=${PJ_QT_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "emscripten=${PJ_EMSCRIPTEN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "node=${PJ_WASM_NODE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Install build tools
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build python3-pip make pkg-config
          # Scene2D video cross-compiles dav1d, whose build system is meson.
          python3 -m pip install --user meson
          # Runtime libraries for the desktop host Qt tools (qsb bakes the QRhi
          # shaders offline and transitively links the full Qt GUI stack, even
          # headless). The lean runner ships none of these, so qsb would die at
          # load time with exit 127.
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libfontconfig1 libfreetype6 libxkbcommon0 \
            libx11-6 libxcb1 libglib2.0-0 libdbus-1-3

      - name: Cache Qt WebAssembly and host kits
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        id: qt-cache
        uses: actions/cache/restore@v5
        with:
          path: .qt-wasm
          key: qt-wasm-${{ steps.versions.outputs.wasm_qt }}-multithread-shadertools-v1

      - name: Install Qt WebAssembly and host kits
        if: (env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true') && steps.qt-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user 'aqtinstall==3.3.0'
          "${HOME}/.local/bin/aqt" install-qt linux desktop \
            "${PJ_QT_VERSION}" linux_gcc_64 --outputdir .qt-wasm \
            -m qtshadertools
          "${HOME}/.local/bin/aqt" install-qt all_os wasm \
            "${PJ_QT_VERSION}" wasm_multithread --outputdir .qt-wasm \
            -m qtshadertools

      - name: Cache Emscripten SDK
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        id: emsdk-cache
        uses: actions/cache/restore@v5
        with:
          path: .emsdk
          key: emsdk-${{ steps.versions.outputs.emscripten }}-linux-x64-v1

      - name: Install Emscripten SDK
        if: (env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true') && steps.emsdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${PJ_EMSCRIPTEN_VERSION}" \
            https://github.com/emscripten-core/emsdk.git .emsdk
          .emsdk/emsdk install "${PJ_EMSCRIPTEN_VERSION}"
          .emsdk/emsdk activate "${PJ_EMSCRIPTEN_VERSION}"

      - name: Restore WebAssembly compiler cache
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        # restore/save split rather than actions/cache: the implicit post-job
        # save fires on every run and the SHA-keyed entry is never an exact
        # hit, so each run persisted a new blob of up to max_size (4 G below)
        # into billed Depot Cache storage. See linux-ci.yml's "Save ccache".
        id: ccache_restore
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/ccache
          key: ccache-zh4-localized-857bd12b935579458914de18b59d8950b8bf71bd
          restore-keys: |
            ccache-zh4-localized-

      - name: Configure compiler cache
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        run: |
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=hash_dir=false
          ccache --set-config=base_dir="${GITHUB_WORKSPACE}"
          ccache --zero-stats

      - name: Cache the WebAssembly CPython build
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        # A content key (the recipe with its pinned tarball hash, the Emscripten
        # release): an exact hit or a cold ~4 minute build, so the plain action,
        # which saves only on a miss, adds one entry per recipe change.
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/pj-wasm-cpython
          key: wasm-cpython-${{ hashFiles('cmake/PjWasmPython.cmake', 'cmake/wasm_python/**') }}-emsdk-${{ steps.versions.outputs.emscripten }}

      - name: Build acceptance configuration (shipped defaults, ingress probe on)
        if: env.COMPARE_LUAU_ONLY == 'true' || env.COMPARE_E_ONLY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source .emsdk/emsdk_env.sh >/dev/null
          cmake -S . -B build-wasm-probe -G Ninja \
            -DCMAKE_EXE_LINKER_FLAGS=--emit-symbol-map \
            -DCMAKE_TOOLCHAIN_FILE="${PWD}/.qt-wasm/${PJ_QT_VERSION}/wasm_multithread/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${PWD}/.qt-wasm/${PJ_QT_VERSION}/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPJ_BUILD_TESTS=OFF \
            -DPJ_BUILD_DEMOS=OFF \
            -DPJ_WASM_ENABLE_INGRESS_PROBE=ON \
            -DPJ_WASM_SCENE3D_CAPABILITY_PROBE=ON \
            -DPJ_WASM_WITH_SCENE2D=ON \
            -DPJ_WASM_WITH_SCENE3D=ON \
            -DPJ_WASM_WITH_PYTHON=ON \
            -DPJ_WASM_PYTHON_CACHE_DIR="${HOME}/.cache/pj-wasm-cpython"
          cmake --build build-wasm-probe \
            --target pj_app --parallel 2
          ccache --show-stats

      - name: Verify D acceptance package and run one exact same-runner A/D pair
        if: env.COMPARE_LUAU_ONLY == 'true'
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/ab.sh pair

      - name: Verify E acceptance and run one exact Firefox D/E pair
        if: env.COMPARE_E_ONLY == 'true'
        run: bash .replay-controller/scripts/ci/pj71-wasm-replay/de.sh pair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pj71-wasm-artifact-replay-${{ matrix.browser }}-${{ github.run_attempt }}
          path: replay-evidence/

      - name: Preserve distinct D acceptance package for follow-up, not distribution
        if: ${{ !cancelled() && env.COMPARE_LUAU_ONLY == 'true' && hashFiles('replay-evidence/D-acceptance-receipt.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pj71-luau-D-2e9235ef-acceptance-${{ github.run_attempt }}
          path: |
            build-wasm-probe/deploy/
            replay-evidence/D-acceptance-receipt.json
            replay-evidence/D-identity.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
