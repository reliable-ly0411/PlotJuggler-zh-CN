name: Runtime catalog Windows targeted diagnosis
'on':
  push:
    branches: ['zh-CN-4.x-ci/runtime-catalog-diagnostic-696c']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: runtime-catalog-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    name: Diagnostic only (not release acceptance)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.created && github.ref_name == 'zh-CN-4.x-ci/runtime-catalog-diagnostic-696c')
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      matrix:
        include:
        - os: windows-2022
          qt_arch: msvc2022_64
          generator: Ninja Multi-Config
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
        persist-credentials: 'false'
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Read pinned versions
      id: versions
      run: |
        source ./versions.env
        echo "PJ_QT_VERSION=$PJ_QT_VERSION" >> "$GITHUB_ENV"
        echo "qt_version=$PJ_QT_VERSION" >> "$GITHUB_OUTPUT"
    - name: Build tools
      run: python -m pip install 'conan>=2,<3' 'cmake>=3.28,<4' 'ninja!=1.13.0' 'aqtinstall>=3.3'
    - uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - uses: actions/cache/restore@v5
      with:
        path: .qt
        key: zh4-qt-${{ matrix.os }}-${{ steps.versions.outputs.qt_version }}
    - name: Install pinned Windows Qt
      shell: pwsh
      run: ./scripts/windows/install_qt6.ps1
    - uses: actions/cache/restore@v5
      id: conan-cache
      with:
        path: ~/.conan2
        key: zh4-conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}
        restore-keys: |
          zh4-conan-${{ matrix.os }}-${{ hashFiles('conanfile.txt', 'conan.lock') }}-partial-
          zh4-conan-${{ matrix.os }}-
    - name: Prepare Conan sources
      timeout-minutes: 12
      run: |
        conan profile detect --force
        ./scripts/configure_conan_remote.sh
        cache_dir="$(python -c 'import os; print(os.path.abspath(".conan-source-cache").replace(chr(92), "/"))')"
        conan_home="$(conan config home)"
        mkdir -p "$conan_home"
        python - "$conan_home/global.conf" "$cache_dir" <<'PY'
        from pathlib import Path
        import hashlib
        import json
        import re
        import shutil
        import sys
        # Conan 2.34 trusts local cache hits without rehashing. Validate every
        # repository seed before copying any bytes into that trusted cache.
        seeds = Path('.github/conan/source-backup')
        blobs = sorted(p for p in seeds.iterdir() if re.fullmatch(r'[0-9a-f]{64}', p.name))
        for blob in blobs:
            if hashlib.sha256(blob.read_bytes()).hexdigest() != blob.name:
                raise SystemExit(f'Conan source backup SHA256 mismatch: {blob.name}')
            metadata = json.loads(blob.with_suffix('.json').read_text(encoding='utf-8'))
            if not metadata.get('references'):
                raise SystemExit(f'Conan source backup metadata missing references: {blob.name}')
        target = Path(sys.argv[2]) / 's'
        target.mkdir(parents=True, exist_ok=True)
        for blob in blobs:
            shutil.copy2(blob, target / blob.name)
            shutil.copy2(blob.with_suffix('.json'), target / (blob.name + '.json'))
        p = Path(sys.argv[1])
        lines = p.read_text(encoding='utf-8').splitlines() if p.exists() else []
        lines = [s for s in lines if not s.startswith(('core.sources:download_cache=', 'core.sources:download_urls='))]
        lines += [f'core.sources:download_cache={sys.argv[2]}',
                  'core.sources:download_urls=["origin", "https://c3i.jfrog.io/artifactory/conan-center-backup-sources/"]']
        p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
        PY
        python scripts/prefetch_assimp_source.py --cache-dir "$cache_dir"
    - name: Resolve exact Windows SDK and dependencies
      id: conan-windows
      shell: pwsh
      run: |
        # setup-python injects a native path which conflicts with Conan's
        # MSYS pkg-config search path. Let the locked dependency graph own it.
        # https://github.com/conan-io/setup-conan#using-setup-python-action-alongside-setup-conan
        Remove-Item Env:PKG_CONFIG_PATH -ErrorAction SilentlyContinue
        conan install . --output-folder=build --build=missing `
          -r=plotjuggler-conan -r=conancenter --lockfile=conan.lock --lockfile-partial `
          -s build_type=RelWithDebInfo -s compiler.cppstd=20 -c tools.build:jobs=2 `
          -o 'cpython/*:shared=True' -s 'cpython/*:build_type=Release' `
          -s compiler.version=194 -c 'tools.cmake.cmaketoolchain:generator=Ninja Multi-Config'
        exit $LASTEXITCODE
    - name: Configure unchanged dependencies and build only language regression
      run: |
        cmake -S . -B build -G "${{ matrix.generator }}" \
          -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake \
          -DCMAKE_PREFIX_PATH="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}" \
          -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPJ_BUILD_TESTS=ON -DPJ_BUILD_DEMOS=OFF \
          -DPJ_PLUGIN_FEEDBACK_ACCEPTANCE=OFF \
          -DCMAKE_POLICY_DEFAULT_CMP0141=NEW -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
        cmake --build build --config RelWithDebInfo --target runtime_catalog_language_test --parallel 2
    - name: Run only RuntimeCatalogLanguageTest (diagnostic, not release acceptance)
      run: |
        export PATH="$PWD/.qt/$PJ_QT_VERSION/${{ matrix.qt_arch }}/bin:$PATH"
        for list in build/pj_ffmpeg_bin_dirs.txt build/pj_python_bin_dirs.txt; do
          if [[ -f "$list" ]]; then
            while IFS= read -r dir; do
              [[ -z "$dir" ]] || export PATH="$(cygpath -u "$dir"):$PATH"
            done < "$list"
          fi
        done
        # Direct subdirectory prevents PRE_TEST discovery of unrelated, unbuilt runners.
        set +e
        ctest --test-dir build/pj_app --build-config RelWithDebInfo -R '^RuntimeCatalogLanguageTest$' --no-tests=error --output-on-failure -V --timeout 120 > runtime-catalog-private.log 2>&1
        result=$?
        set -e
        mkdir -p runtime-catalog-evidence
        printf 'ctest_exit=%s\n' "$result" > runtime-catalog-evidence/result.txt
        git rev-parse HEAD >> runtime-catalog-evidence/result.txt
        # Never upload arbitrary Qt/loader exception text, paths, or environment.
        python - <<'PYSAFE'
        from pathlib import Path
        import re
        raw = Path('runtime-catalog-private.log').read_text(errors='replace')
        stages = ('temporary-directory', 'create-unicode-directory', 'copy-fixture-dlls',
                  'create-invalid-dll', 'install-translator', 'scan-directory',
                  'verify-catalog', 'leave-test-body')
        stage = '(?:' + '|'.join(stages) + ')'
        pattern = re.compile(r'\[runtime-catalog-diagnostic\] (?:stage=' + stage +
                             r'|ACP=[0-9]{1,10}|exception=(?:filesystem_error|system_error) stage=' + stage +
                             r' code=-?[0-9]{1,10}|exception=(?:std_exception|unknown) stage=' + stage + ')')
        markers = []
        for line in raw.splitlines():
            # CTest's numeric output prefix is allowed, arbitrary trailing text is not.
            line = re.sub(r'^\d+: ', '', line)
            if pattern.fullmatch(line):
                markers.append(line)
        Path('runtime-catalog-evidence/markers.txt').write_text('\n'.join(markers) + '\n')
        print('\n'.join(markers))
        PYSAFE
        exit "$result"
    - name: Retain bounded diagnostic markers only
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: runtime-catalog-targeted-diagnostic
        path: runtime-catalog-evidence/
        if-no-files-found: warn
        retention-days: 7
